// 한 장의 보물 %
// 48개 스테이지에 보물 하나씩. 그룹별 보물 수는 원작과 같음 (합계 48)
// 원작처럼 스테이지 순서대로 그룹을 이어서 배치: 1~7 영양드링크, 8~11 금고, 12~16 시계 …
const TREASURE_COUNT = { drink:7, safe:4, clock:5, stone:7, wall:3, register:3, shield:3, sword:7, core:6, turbo:1, bible:2 };
(function(){
  let i = 0;
  TREASURES.forEach(t => { t.stages = STAGES.slice(i, i + TREASURE_COUNT[t.id]).map(st => st.id); i += TREASURE_COUNT[t.id]; });
})();
function treasurePctCh(id, ch){
  const g = TREASURES.find(t => t.id === id);
  return Math.round(g.stages.filter(id => PLAYER.cleared.includes(stageKey(ch, id))).length / g.stages.length * 100);
}
// 3장 합계 % (최대 300%)
function treasurePct(id){ return CHAPTERS.reduce((a, c) => a + treasurePctCh(id, c.no), 0); }
// 효과: 한 장 100%당 값 (3장 모두 100%면 3배)
const TREASURE_FX = {
  drink:    p => 1 + 0.5 * p / 100,       // 장당 머니 생산량 +50%
  clock:    p => 1.0 * p / 100,           // 장당 재생산 간격 -1초 (최소 2초)
  stone:    p => 1 + 1.0 * p / 100,       // 장당 클리어 보상 돈 +100%
  wall:     p => 7000 * p / 100,          // 장당 아군 성 체력 +7000 (원작)
  register: p => 1 + 0.5 * p / 100,       // 장당 적 처치 머니 +50%
  shield:   p => 1 + 0.5 * p / 100,       // 장당 아군 체력 +50%
  sword:    p => 1 + 0.5 * p / 100,       // 장당 아군 공격력 +50%
  core:     p => 500 * p / 100,           // 장당 냥코 대포 공격력 +500 (원작)
  turbo:    p => 3.33 * p / 100,          // 장당 냥코 대포 충전 시간 -3.33초
};
function tfx(id){ return TREASURE_FX[id](treasurePct(id)); }
function treasuresOfStage(stage){
  return TREASURES.filter(t => t.stages.includes(stage.id)).map(t => ({ t, ch: stage.ch }));
}

// ---------- 냥코 대포 ----------
const CANNON = { sweepTime: 0.6 };
// 대포 공격력 = 1600 + 50×(공격력 레벨-1) + 보물 코어 100%당 500   (원작: 1레벨+코어300% = 3100)
function cannonDamage(){ return 1600 + 50 * (pLv('cannon-atk') - 1) + tfx('core'); }
// 충전 시간 = 50초 - 충전 레벨당 1.32초 - 터보머신 100%당 3.33초 + 공격력 레벨당 1.67초, 31.67초 ~ 50초 사이
function cannonCharge(){ return Math.min(50, Math.max(31.67, 50 - 1.32 * (pLv('cannon-charge') - 1) - tfx('turbo') + 1.67 * (pLv('cannon-atk') - 1))); }
// 사정거리: 1레벨 600 → 10레벨 1400 (적 성까지 닿음)
function cannonReach(){ return 600 + (800 / 9) * (Math.min(10, pLv('cannon-range')) - 1); }
// 성 체력: 1레벨 1000, 2~5레벨 +1000, 6~7레벨 +2000, 8레벨부터 +3000 (원작 표) + 보물 벽
function castleHp(){
  const lv = pLv('castle'); let hp = 1000;
  for (let l = 2; l <= lv; l++) hp += l <= 5 ? 1000 : l <= 7 ? 2000 : 3000;
  return hp + tfx('wall');
}
// 회계력: 적 처치 머니 배율 (레벨당 +5%, 보물 레지스터 100%당 +50%) → 다 올리면 3.95배
function killMoneyMul(){ return 1 + 0.05 * (pLv('accounting') - 1) + 0.5 * treasurePct('register') / 100; }
// 공부력: 클리어 보상 돈 레벨당 +5%
function studyMul(){ return 1 + 0.05 * (pLv('study') - 1); }

// ---------- 전투 ----------
(function(){
  const WORLD = 1600, ENEMY_BASE_X = 110, CAT_BASE_X = 1490, BASE_HALF = 60, SPEED_SCALE = 6;
  const battle = document.getElementById('battle'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const moneyEl = document.getElementById('money'), walletEl = document.getElementById('wallet');
  const slotsEl = document.getElementById('slots'), result = document.getElementById('result'), resultText = document.getElementById('result-text');

  // SVG 캐릭터를 캔버스용 이미지로
  const imgs = {};
  function svgImage(id, vb){
    const g = document.getElementById(id).outerHTML.replace(/ id="[^"]*"/, '');
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + g + '</svg>');
    return img;
  }
  imgs.soldier = svgImage('soldier', '0 0 240 260');
  ['mouse','crow','pig','snake','bear','hedgehog','raccoon','bigcoon','boar','eagle','hippo','gatekeeper','u-masa','u-jingle','u-battle','u-tank','u-bull','u-bird','u-fish','u-lizard','u-titan','u-eolppak','u-fk','u-jingyeok','u-ssang','u-thanos'].forEach(id => imgs[id] = svgImage(id, '0 0 240 260'));

  let S = null, raf = 0, last = 0;

  function passive(id){ return UNITS.find(u => u.id === id); }

  function start(stage){
    const wallet = passive('wallet');
    const work = passive('work-rate');
    S = {
      stage, t: 0, over: false,
      money: 0,
      walletMax: wallet.capacity(totalLevel(wallet), treasurePct('safe'), 1),
      baseIncome: 15 + 3 * (totalLevel(work) - 1),        // 초당 머니 (임시 공식)
      income: 0,
      workerLv: 1, workerMax: 8,                      // 전투 중 일 고양이(지갑) 레벨, 최대 8레벨
      // 냥코 대포: 충전이 다 차면 발사. 기지에서 왼쪽으로 쭉 쓸고 지나가며 닿은 적 모두에게 피해 + 넉백
      cannon: { charge: 0, time: cannonCharge(), dmg: Math.round(cannonDamage()), reach: cannonReach(), wave: null },
      catBase: { hp: castleHp(), max: castleHp() },
      enemyBase: { hp: stage.enemyBaseHp, max: stage.enemyBaseHp },
      cats: [], enemies: [],
      spawnState: stage.spawns.map(sp => ({ next: sp.first, made: 0 })),
      fx: [], shake: 0,
      deck: getDeck().map(u => ({ unit: u, cd: 0 })),
    };
    S.baseIncome *= tfx('drink');
    S.income = S.baseIncome;
    document.getElementById('stage-tag').textContent = stageLabel(stage);
    buildSlots();
    result.hidden = true;
    battle.hidden = false;
    resize();
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  // 지갑 업그레이드: 일 효율 공식으로 비용, 지갑 공식으로 최대 머니
  function workerCost(){ return passive('work-rate').upgradeCost(totalLevel(passive('work-rate')), S.workerLv); }
  function upgradeWorker(){
    if (S.over || S.workerLv >= S.workerMax) return;
    const cost = workerCost();
    if (S.money < cost) return;
    S.money -= cost;
    S.workerLv++;
    const w = passive('wallet');
    S.walletMax = w.capacity(totalLevel(w), treasurePct('safe'), S.workerLv);   // 업그레이드할 때마다 용량 증가 (상한 없음)
    S.income = S.baseIncome * (1 + 0.15 * (S.workerLv - 1));   // 레벨당 +15% (임시)
  }
  document.getElementById('worker').addEventListener('click', upgradeWorker);
  document.getElementById('cannon').addEventListener('click', () => {
    if (!S || S.over || S.cannon.charge < 1 || S.cannon.wave) return;
    S.cannon.charge = 0;
    S.cannon.wave = { t: 0, hit: new Set() };
    S.shake = 0.3;
  });

  function buildSlots(){
    slotsEl.innerHTML = '';
    for (let i = S.deck.length; i < 10; i++) S.deck.push(null);
    S.deck.forEach(d => {
      if (!d) { const e = document.createElement('div'); e.className = 'slot empty'; slotsEl.appendChild(e); return; }
      const b = document.createElement('button');
      b.className = 'slot';
      b.setAttribute('aria-label', d.unit.name + ' 생산');
      b.innerHTML = '<svg viewBox="' + (d.unit.iconBox || '22 24 196 168') + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#' + (d.unit.art || 'soldier') + '"/></svg><span class="cd"></span><span class="cost">' + d.unit.cost + '원</span>';
      b.addEventListener('click', () => produce(d));
      d.el = b;
      slotsEl.appendChild(b);
    });
  }

  function produce(d){
    if (S.over || d.cd > 0 || S.money < d.unit.cost) return;
    S.money -= d.unit.cost;
    d.cdMax = d.unit.cooldown < 2 ? d.unit.cooldown : Math.max(2, d.unit.cooldown - tfx('clock') - 0.2 * (pLv('research') - 1));
    d.cd = d.cdMax;
    const u = d.unit, hp = Math.round(unitHp(u) * tfx('shield')), ap = Math.round(unitAp(u) * tfx('sword') * 10) / 10;
    S.cats.push(makeFighter(u, hp, ap, CAT_BASE_X - BASE_HALF, -1, { img: u.art || 'soldier', size: u.size || 70, fly: !!u.fly, hand: u.hand }));
  }

  function spawnEnemy(key){
    const e = ENEMIES[key], m = S.stage.mult || 1;          // 장이 올라갈수록 적 강화
    S.enemies.push(makeFighter(e, Math.round(e.hp * m), Math.round(e.ap * m), ENEMY_BASE_X + BASE_HALF, 1, { img: e.art, size: e.size, fly: !!e.fly, boss: !!e.boss, key }));
  }

  // 사정거리 안의 가장 앞에 있는 적(또는 기지)
  function makeFighter(d, hp, ap, x, dir, extra){
    return Object.assign({
      x, dir, hp, max: hp, ap, range: d.range, speed: d.speed, kb: d.kb || 1, kbDone: 0,
      type: d.attackType || 'single', fore: d.foreswing, back: d.backswing, interval: d.attackInterval,
      motion: d.motion, state: 'move', st: 0, cdAtk: 0, hitDone: false, dying: false,
      dead: 0, walk: Math.random() * 6,
    }, extra);
  }

  const KB_TIME = 0.45, KB_DIST = 70;
  function targetable(f){ return !f.dead && !f.dying && f.state !== 'kb'; }
  function frontDist(u, f){ return (f.x - u.x) * u.dir; }
  function baseDist(u, baseX){ return (baseX - BASE_HALF * u.dir - u.x) * u.dir; }

  // 사거리 안의 가장 앞의 적(없으면 기지)
  function findTarget(u, foes, foeBase, foeBaseX){
    let best = null, bestD = Infinity;
    for (const f of foes) {
      if (!targetable(f)) continue;
      const d = frontDist(u, f);
      if (d >= -10 && d <= u.range && d < bestD) { best = f; bestD = d; }
    }
    if (best) return best;
    return baseDist(u, foeBaseX) <= u.range ? foeBase : null;
  }

  function knockback(t){
    t.state = 'kb'; t.st = KB_TIME; t.hitDone = true;
  }

  // 피해 처리: 넉백 중 무적, 체력/히트백 만큼 받을 때마다 넉백, 죽을 때도 넉백
  function damage(t, amt, base, src){
    if (t === base) { t.hp = Math.max(0, t.hp - amt); return; }
    if (!targetable(t)) return;
    t.hp = Math.max(0, t.hp - amt);
    if (t.hp <= 0 && src && src.motion === 'snap') {               // 타노스에게 쓰러지면 먼지가 되어 흩어짐
      t.dying = true; t.dead = 0.0001; t.dust = true;
      S.fx.push({ dustOf: t, x: t.x, dir: src.dir, size: t.size, fly: t.fly, t: 0, dur: 1.4, seed: Math.random() * 100 });
      return;
    }
    if (t.hp <= 0) { t.dying = true; knockback(t); return; }
    const n = Math.floor((t.max - t.hp) / (t.max / t.kb));
    if (n > t.kbDone) { t.kbDone = n; knockback(t); }
  }

  function strike(u, foes, foeBase, foeBaseX){
    if (u.type === 'area') {
      let hitAny = false;
      for (const f of foes) {
        if (!targetable(f)) continue;
        const d = frontDist(u, f);
        if (d >= -10 && d <= u.range) { damage(f, u.ap, foeBase, u); hitAny = true; }
      }
      if (baseDist(u, foeBaseX) <= u.range) { damage(foeBase, u.ap, foeBase); hitAny = true; }
      return hitAny;
    }
    const t = findTarget(u, foes, foeBase, foeBaseX);
    if (!t) return false;
    damage(t, u.ap, foeBase);
    if (u.motion === 'wand') S.fx.push({ x: u.x, tx: t === foeBase ? foeBaseX - BASE_HALF * u.dir : t.x, t: 0, dur: 0.4, star: true });
    if (u.motion === 'throw') S.fx.push({ x: u.x, tx: t === foeBase ? foeBaseX - BASE_HALF * u.dir : t.x, t: 0, dur: 0.35, acorn: true });
    if (u.motion === 'fire') S.fx.push({ x: u.x, tx: t === foeBase ? foeBaseX - BASE_HALF * u.dir : t.x, t: 0, dur: 0.4, fire: true });
    if (u.motion === 'shoot') S.fx.push({ x: u.x, tx: t === foeBase ? foeBaseX - BASE_HALF * u.dir : t.x, t: 0, dur: 0.3, arrow: true });
    if (u.motion === 'spit') S.fx.push({ x: u.x, tx: t === foeBase ? foeBaseX - BASE_HALF * u.dir : t.x, t: 0, dur: 0.35 });
    return true;
  }

  // 공격 모션: p = 0→1 진행도 (0.5 = 선딜이 끝나고 타격하는 순간)
  // dx 앞쪽 이동, dy 아래(+)/위(-), rot 앞으로 기울기, sx/sy 늘이기
  function motionPose(m, p){
    const s = Math.sin(Math.PI * p);
    switch (m) {
      case 'roll':   return { dx: s * 30, dy: -s * 10, rot: p * Math.PI * 2, sx: 1, sy: 1 };                 // 따끔이: 몸을 말아 데굴데굴 굴러 찌르기
      case 'throw':  return { dx: -s * 6, dy: 0, rot: p < .5 ? -p * .6 : (1 - p) * .6, sx: 1, sy: 1 };      // 너굴이: 도토리 던지기
      case 'snap': {                                                                                        // 타노스: 천천히 힘을 모아 손가락 튕기기(딱!)
        if (p < .5) { const q = p / .5; return { dx: -q * 8, dy: -q * 6, rot: -q * .08 + Math.sin(q * 90) * .01 * q, sx: 1 + .05 * q, sy: 1 + .05 * q }; }
        const q = (p - .5) / .5; return { dx: -8 + 8 * q + (q < .15 ? 6 : 0), dy: -6 * (1 - q), rot: -.08 * (1 - q), sx: 1.05 - .05 * q, sy: 1.05 - .05 * q };
      }
      case 'twin': {                                                                                        // 쌍뻐큐: 부들부들 기 모으기 → 몸을 비틀며 양손 번개
        if (p < .5) { const q = p / .5; return { dx: Math.sin(q * 60) * 3 * q, dy: 0, rot: Math.sin(q * 50) * .04, sx: 1 - .06 * q, sy: 1 + .06 * q }; }
        const q = (p - .5) / .5, s2 = Math.sin(Math.PI * q);
        return { dx: s2 * 14, dy: -s2 * 6, rot: Math.sin(q * Math.PI * 2) * .18, sx: 1 + .12 * s2, sy: 1 + .12 * s2 };
      }
      case 'leap': {                                                                                        // 진격: 웅크렸다가 크게 뛰어올라 내려찍기
        if (p < .15) { const q = p / .15; return { dx: 0, dy: 0, rot: 0, sx: 1 + .12 * q, sy: 1 - .2 * q }; }            // 웅크리기
        if (p < .5)  { const q = (p - .15) / .35; return { dx: q * 70, dy: -Math.sin(Math.PI * q) * 120, rot: .25 * Math.sin(Math.PI * q), sx: .92, sy: 1.12 }; } // 점프
        const q = (p - .5) / .5; return { dx: 70 * (1 - q), dy: 0, rot: 0, sx: 1 + .25 * (1 - q), sy: 1 - .2 * (1 - q) };  // 착지 후 제자리로
      }
      case 'finger': return p < .5                                                                          // 뻐큐: 뒤로 젖혔다가 손가락을 확 내밀며 번개 발사
                       ? { dx: -p * 24, dy: 0, rot: -p * .5, sx: 1, sy: 1 }
                       : { dx: -12 + Math.sin(Math.PI * (p - .5) * 2) * 30, dy: -Math.sin(Math.PI * (p - .5) * 2) * 8, rot: .2 * Math.sin(Math.PI * (p - .5) * 2), sx: 1 + .18 * Math.sin(Math.PI * (p - .5) * 2), sy: 1 + .18 * Math.sin(Math.PI * (p - .5) * 2) };
      case 'ramen':  return p < .5                                                                           // 마사: 라면을 뒤로 들었다가 힘껏 던지기
                       ? { dx: -p * 16, dy: -p * 6, rot: -p * .5, sx: 1, sy: 1 }
                       : { dx: -8 + Math.sin(Math.PI * (p - .5) * 2) * 22, dy: 0, rot: .3 * Math.sin(Math.PI * (p - .5) * 2), sx: 1, sy: 1 };
      case 'wand':   return { dx: s * 6, dy: -s * 10, rot: p < .5 ? -p * .5 : (1 - p) * .5, sx: 1, sy: 1 };      // 마사 고양이: 손을 휘둘러 별 날리기
      case 'zoom':   return { dx: s * 20, dy: -s * 6, rot: 0, sx: 1 + s * .35, sy: 1 + s * .35 };           // 얼빡: 얼굴을 확 들이밀기
      case 'scream': return { dx: -s * 4, dy: 0, rot: 0, sx: 1 + s * .14, sy: 1 + s * .14 };            // 소리 지르기 (음파)
      case 'horn':   return { dx: s * 16, dy: 0, rot: s * .2, sx: 1, sy: 1 };                          // 황소: 뿔로 콕콕 들이받기
      case 'flap':   return { dx: s * 26, dy: p < .5 ? -s * 18 : s * 22, rot: s * .35, sx: 1 + s * .1, sy: 1 - s * .05 }; // 새: 솟았다가 내려꽂기
      case 'tail':   return { dx: s * 8, dy: 0, rot: -Math.sin(2 * Math.PI * p) * .45, sx: 1, sy: 1 };      // 피쉬: 몸을 틀어 꼬리 후려치기
      case 'fire':   return { dx: -s * 6, dy: 0, rot: -s * .08, sx: 1 + s * .1, sy: 1 - s * .08 };          // 도마뱀: 숨을 들이쉬고 불 뿜기
      case 'shoot':  return { dx: -s * 10, dy: 0, rot: -s * .12, sx: 1, sy: 1 };                         // 징글: 활시위를 당겼다 쏘기
      case 'slash':  return { dx: s * 22, dy: -s * 6, rot: p < .5 ? -p * .8 : (1 - p) * .9, sx: 1, sy: 1 }; // 배틀: 칼 휘두르기
      case 'shield': return { dx: s * 10, dy: 0, rot: 0, sx: 1 + s * .08, sy: 1 - s * .06 };              // 탱크: 방패로 밀치기
      case 'bonk':   return { dx: s * 18, dy: -s * 4, rot: s * .3, sx: 1, sy: 1 };                         // 고양이: 헬멧 박치기
      case 'bite':   { const h = Math.abs(Math.sin(2 * Math.PI * p)); return { dx: h * 12, dy: -h * 8, rot: 0, sx: 1, sy: 1 }; } // 쥐: 콩콩 깨물기
      case 'swoop':  return { dx: s * 34, dy: s * 34, rot: s * .5, sx: 1, sy: 1 };                         // 까마귀: 급강하 쪼기
      case 'charge': return { dx: p < .35 ? -p / .35 * 14 : Math.sin(Math.PI * (p - .35) / .65) * 40 - 14 * (1 - (p - .35) / .65), dy: 0, rot: p < .35 ? -.15 : .1, sx: 1, sy: 1 }; // 돼지: 뒤로 뺐다가 돌진
      case 'spit':   return { dx: 0, dy: 0, rot: -s * .1, sx: 1 - s * .12, sy: 1 + s * .18 };              // 뱀: 몸을 세워 침뱉기
      case 'slam':   return { dx: s * 10, dy: p < .5 ? -Math.sin(Math.PI * p) * 50 : 0, rot: 0, sx: p > .5 ? 1 + .15 * (1 - p) * 2 : 1, sy: p > .5 ? 1 - .15 * (1 - p) * 2 : 1 }; // 곰: 점프 후 내려찍기
    }
    return { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 };
  }
  function attackProgress(u){
    return u.st < u.fore ? (u.st / u.fore) * .5 : .5 + Math.min(1, (u.st - u.fore) / Math.max(.01, u.back)) * .5;
  }

  function stepSide(list, foes, foeBase, foeBaseX, dt){
    for (const u of list) {
      if (u.dead) { u.dead += dt; continue; }
      u.cdAtk = Math.max(0, u.cdAtk - dt);

      if (u.state === 'kb') {                        // 넉백: 뒤로 밀려나며 무적
        u.st -= dt;
        u.x -= u.dir * (KB_DIST / KB_TIME) * dt;
        u.x = Math.max(ENEMY_BASE_X + BASE_HALF, Math.min(CAT_BASE_X - BASE_HALF, u.x));
        if (u.st <= 0) { if (u.dying) u.dead = 0.0001; else u.state = 'move'; }
        continue;
      }

      if (u.state === 'attack') {                    // 선딜 → 타격 → 후딜 (공격간격은 타격 순간부터)
        u.st += dt;
        if (!u.hitDone && u.st >= u.fore) {
          u.hitDone = true;
          u.cdAtk = u.interval;
          strike(u, foes, foeBase, foeBaseX);
          if (u.motion === 'slam') S.shake = 0.35;
          if (u.motion === 'ramen') {                     // 라면 던지기: 가장 가까운 적(없으면 기지)으로 날아감
            const tg = findTarget(u, foes, foeBase, foeBaseX);
            const tx = !tg ? u.x + u.dir * u.range * .6 : tg === foeBase ? foeBaseX - BASE_HALF * u.dir : tg.x;
            S.fx.push({ x: u.x, tx, t: 0, dur: 0.55, ramen: true });
          }
          if (u.motion === 'snap') { S.flash = 0.35; S.shake = 0.3; S.fx.push({ x: u.x, dir: u.dir, t: 0, dur: 0.6, snapRing: true, h: u.size, hand: u.hand }); }
          if (u.motion === 'twin') { S.fx.push({ x: u.x, dir: u.dir, range: u.range, t: 0, dur: 0.45, twin: true, h: u.size }); S.shake = 0.2; }
          if (u.motion === 'leap') { S.fx.push({ x: u.x + u.dir * 70, dir: u.dir, range: u.range, t: 0, dur: 0.7, quake: true, seed: Math.random() * 99 }); S.shake = 0.6; }
          if (u.motion === 'finger') { S.fx.push({ x: u.x, dir: u.dir, range: u.range, t: 0, dur: 0.4, beam: true, h: u.size }); S.shake = 0.15; }
          if (u.motion === 'scream') S.fx.push({ x: u.x, dir: u.dir, range: u.range, t: 0, dur: 0.45, wave: true });
        }
        if (u.st >= u.fore + u.back) u.state = 'move';
        continue;
      }

      const target = findTarget(u, foes, foeBase, foeBaseX);
      if (target) {
        if (u.cdAtk <= 0) { u.state = 'attack'; u.st = 0; u.hitDone = false; }
      } else {
        u.x += u.dir * u.speed * SPEED_SCALE * dt;
        u.walk += dt * 10;
      }
    }
  }

  function update(dt){
    if (S.over) return;
    S.t += dt;
    S.money = Math.min(S.walletMax, S.money + S.income * dt);
    S.deck.forEach(d => { if (d) d.cd = Math.max(0, d.cd - dt); });

    S.stage.spawns.forEach((sp, i) => {
      const st = S.spawnState[i];
      if (S.t >= st.next) {
        const alive = S.enemies.filter(e => !e.dead && e.key === sp.enemy).length;
        if (alive < sp.maxAlive && (!sp.count || st.made < sp.count)) { spawnEnemy(sp.enemy); st.made++; }
        st.next += sp.every;
      }
    });

    S.fx.forEach(f => f.t += dt); S.fx = S.fx.filter(f => f.t < f.dur);
    S.shake = Math.max(0, S.shake - dt);
    S.flash = Math.max(0, (S.flash || 0) - dt);
    const cn = S.cannon;
    if (!cn.wave) cn.charge = Math.min(1, cn.charge + dt / cn.time);
    else {                                           // 대포 파동이 기지에서 왼쪽으로 이동하며 닿은 적을 때림
      cn.wave.t += dt;
      const front = CAT_BASE_X - BASE_HALF - cn.reach * Math.min(1, cn.wave.t / CANNON.sweepTime);
      for (const e of S.enemies) {
        if (e.dead || e.dying || cn.wave.hit.has(e) || e.x < front) continue;
        cn.wave.hit.add(e);
        e.hp = Math.max(0, e.hp - cn.dmg);
        if (e.hp <= 0) e.dying = true;
        knockback(e);                                  // 대포는 맞으면 무조건 넉백
      }
      if (cn.wave.t > CANNON.sweepTime + 0.3) cn.wave = null;
    }
    stepSide(S.cats, S.enemies, S.enemyBase, ENEMY_BASE_X, dt);
    stepSide(S.enemies, S.cats, S.catBase, CAT_BASE_X, dt);
    for (const e of S.enemies) if (e.dead && !e.paid) {       // 적 처치 머니
      e.paid = true;
      S.money = Math.min(S.walletMax, S.money + Math.round((ENEMIES[e.key].money || 0) * killMoneyMul()));
    }
    S.cats = S.cats.filter(u => u.dead < 0.6);
    S.enemies = S.enemies.filter(u => u.dead < 0.6);

    if (S.enemyBase.hp <= 0) finish(true);
    else if (S.catBase.hp <= 0) finish(false);
  }

  function finish(win){
    S.over = true;
    const rw = document.getElementById('rewards');
    rw.innerHTML = '';
    if (win) {
      const r = S.stage.reward, first = !PLAYER.cleared.includes(S.stage.key);
      PLAYER.clearCount = PLAYER.clearCount || {};
      PLAYER.clearCount[S.stage.key] = (PLAYER.clearCount[S.stage.key] || 0) + 1;
      const gain = Math.round(r.money * tfx('stone') * studyMul());
      PLAYER.money += gain;
      rw.innerHTML = '<div>돈 +' + gain.toLocaleString() + '</div>';
      if (first) {
        PLAYER.cleared.push(S.stage.key);
        if (r.nyankoTicket) { PLAYER.nyankoTicket += r.nyankoTicket; rw.innerHTML += '<div class="first">냥코 티켓 +' + r.nyankoTicket + ' (최초 클리어)</div>'; }
        if (r.rareTicket) { PLAYER.rareTicket += r.rareTicket; rw.innerHTML += '<div class="first">레어 티켓 +' + r.rareTicket + ' (최초 클리어)</div>'; }
        const got = treasuresOfStage(S.stage);
        const chName = S.stage.chName;
        if (S.stage.ch === 1 && !PLAYER.ch1Reward && chapterCleared(1)) {        // 1장 첫 클리어 보상
          PLAYER.ch1Reward = true;
          if (!PLAYER.owned.includes('masa')) PLAYER.owned.push('masa');
          rw.innerHTML += '<div class="ch-clear">축하합니다. 1장을 클리어하셨습니다!</div>' +
                          '<div class="ch-reward">EX 캐릭터 \'마사 고양이\'를 획득하셨습니다!</div>';
        }
        if (got.length) rw.innerHTML += '<div class="treasure">' + chName + ' 보물 획득! ' + got.map(x => '최고급 ' + x.t.name + ' (' + treasurePctCh(x.t.id, x.ch) + '%)').join(', ') + '</div>';
      }
      savePlayer(); renderPlayer();
    }
    resultText.textContent = win ? '승리!' : '패배...';
    result.classList.toggle('lose', !win);
    setTimeout(() => { result.hidden = false; }, 700);
  }

  // ---------- 그리기 ----------
  let cw = 0, ch = 0, dpr = 1;
  function resize(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = r.width; ch = r.height;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  window.addEventListener('resize', () => { if (!battle.hidden) resize(); });

  function drawBase(x, base, isCat, k, gy){
    const w = 120 * k, h = 230 * k, left = x * k - w / 2, top = gy - h;
    ctx.lineWidth = 5 * k; ctx.strokeStyle = '#2a1708'; ctx.lineJoin = 'round';
    const shake = base.hit ? (Math.random() - .5) * 6 * k : 0;
    ctx.save(); ctx.translate(shake, 0);
    if (isCat) {
      ctx.fillStyle = '#fff7e6';
      ctx.beginPath(); ctx.roundRect(left, top + 40 * k, w, h - 40 * k, 8 * k); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#5f9a3a';
      ctx.beginPath(); ctx.moveTo(left - 12 * k, top + 48 * k); ctx.lineTo(x * k, top - 10 * k); ctx.lineTo(left + w + 12 * k, top + 48 * k); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffcc1f';
      ctx.beginPath(); ctx.arc(x * k, top + 110 * k, 24 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#9b6633';
      ctx.beginPath(); ctx.roundRect(x * k - 22 * k, gy - 60 * k, 44 * k, 60 * k, [22 * k, 22 * k, 0, 0]); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = '#5b4f66';
      ctx.beginPath(); ctx.moveTo(left, gy); ctx.lineTo(left + 14 * k, top + 30 * k); ctx.lineTo(left + w - 14 * k, top + 30 * k); ctx.lineTo(left + w, gy); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3d3447';
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.rect(left + 10 * k + i * 36 * k, top + 6 * k, 28 * k, 26 * k); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = '#ff5f5f';
      ctx.beginPath(); ctx.arc(x * k, top + 100 * k, 16 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x * k - 30 * k, top + 150 * k); ctx.lineTo(x * k - 10 * k, top + 170 * k); ctx.lineTo(x * k + 5 * k, top + 160 * k); ctx.stroke();
    }
    ctx.restore();
    // 체력
    ctx.font = Math.max(12, 26 * k) + 'px "Black Han Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.lineWidth = 4 * k + 2; ctx.strokeStyle = '#2a1708'; ctx.fillStyle = '#fff7e6';
    const txt = Math.ceil(base.hp) + ' / ' + base.max;
    ctx.strokeText(txt, x * k, top - 22 * k); ctx.fillText(txt, x * k, top - 22 * k);
  }

  function drawUnit(u, k, gy){
    const img = imgs[u.img]; if (!img.complete) return;
    const h = u.size * k * 1.4, w = h * 240 / 260;
    const bob = u.dead ? 0 : u.fly ? Math.sin(u.walk * .6) * 6 * k : Math.abs(Math.sin(u.walk)) * 4 * k;
    const pose = u.state === 'attack' && !u.dead ? motionPose(u.motion, attackProgress(u)) : motionPose(null, 0);
    if (u.state === 'kb' && !u.dead) {               // 넉백: 뒤로 튕기며 포물선
      const q = 1 - u.st / KB_TIME;
      pose.dy = -Math.sin(Math.PI * q) * 28; pose.rot = -.25 * Math.sin(Math.PI * q);
    }
    const lift = u.dead && !u.dust ? u.dead * 120 * k : 0;
    const flyY = u.fly ? 45 * k : 0;
    ctx.save();
    if (u.dead) ctx.globalAlpha = Math.max(0, 1 - u.dead / (u.dust ? 0.5 : 0.6));
    ctx.translate(u.x * k + pose.dx * k * u.dir, gy - bob - lift - flyY + pose.dy * k);
    ctx.rotate(pose.rot * u.dir);
    ctx.scale(pose.sx, pose.sy);
    ctx.drawImage(img, -w / 2, -h, w, h);
    if (u.motion === 'snap' && u.state === 'attack' && !u.hitDone && u.hand) {      // 손끝에 보랏빛 기운이 점점 커짐
      const q = Math.min(1, u.st / u.fore), hx = -w / 2 + u.hand[0] * w, hy = -h + u.hand[1] * h;
      const r = (10 + 40 * q) * k * (1 + Math.sin(u.st * 30) * .08);
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.35, 'rgba(200,120,255,.8)'); g.addColorStop(1, 'rgba(120,40,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    const k = cw / WORLD;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gy = ch * 0.62;
    if (S.shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 5);
    const sky = ctx.createLinearGradient(0, 0, 0, gy);
    sky.addColorStop(0, '#3a9be6'); sky.addColorStop(1, '#bfe6ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, cw, gy);
    ctx.fillStyle = '#7fd04a'; ctx.fillRect(0, gy, cw, ch - gy);
    ctx.fillStyle = '#4e9a26'; ctx.fillRect(0, gy + (ch - gy) * .45, cw, ch - gy);
    ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();

    drawBase(ENEMY_BASE_X, S.enemyBase, false, k, gy);
    drawBase(CAT_BASE_X, S.catBase, true, k, gy);
    S.enemies.forEach(u => drawUnit(u, k, gy + 4 * k));
    S.cats.forEach(u => drawUnit(u, k, gy + 10 * k));
    if (S.cannon.wave) {                             // 대포 빔: 기지에서 왼쪽으로 쓸고 지나감
      const w = S.cannon.wave, q = Math.min(1, w.t / CANNON.sweepTime);
      const x0 = (CAT_BASE_X - BASE_HALF) * k, front = (CAT_BASE_X - BASE_HALF - S.cannon.reach * q) * k;
      const fade = w.t > CANNON.sweepTime ? 1 - (w.t - CANNON.sweepTime) / 0.3 : 1;
      ctx.save(); ctx.globalAlpha = Math.max(0, fade);
      const g = ctx.createLinearGradient(front, 0, x0, 0);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.15, 'rgba(255,120,200,.8)'); g.addColorStop(1, 'rgba(255,120,200,.15)');
      ctx.fillStyle = g; ctx.fillRect(front, gy - 70 * k, x0 - front, 60 * k);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(front, gy - 40 * k, 22 * k, 46 * k, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 침 발사체
    S.fx.forEach(f => {
      const p = f.t / f.dur, x = (f.x + (f.tx - f.x) * p) * k, y = gy - 40 * k - Math.sin(Math.PI * p) * 30 * k;
      if (f.arrow) {
        const dir = Math.sign(f.tx - f.x);
        ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x - dir * 22 * k, y); ctx.lineTo(x + dir * 22 * k, y); ctx.stroke();
        ctx.fillStyle = '#dfe7ee'; ctx.beginPath(); ctx.moveTo(x + dir * 30 * k, y); ctx.lineTo(x + dir * 18 * k, y - 6 * k); ctx.lineTo(x + dir * 18 * k, y + 6 * k); ctx.closePath(); ctx.fill(); ctx.stroke();
        return;
      }
      if (f.snapRing) {                                   // 딱! 손끝에서 퍼지는 고리 + 글자
        const h = f.h * 1.4 * k, w = h * 240 / 260;
        const hx = f.x * k - w / 2 + (f.hand ? f.hand[0] : .8) * w, hy = gy - h + (f.hand ? f.hand[1] : .5) * h;
        ctx.save(); ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = '#e8c8ff'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(hx, hy, (10 + 140 * p) * k, 0, Math.PI * 2); ctx.stroke();
        ctx.font = Math.max(14, 46 * k) + 'px "Black Han Sans", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 5; ctx.strokeStyle = '#2a1708'; ctx.fillStyle = '#fff';
        ctx.strokeText('딱!', hx, hy - (30 + 30 * p) * k); ctx.fillText('딱!', hx, hy - (30 + 30 * p) * k);
        ctx.restore();
        return;
      }
      if (f.dustOf) {                                     // 먼지가 되어 바람에 흩날림
        const hgt = f.size * 1.4 * k, wid = hgt * .8, base = gy - (f.fly ? 45 * k : 0);
        ctx.save();
        for (let i = 0; i < 46; i++) {
          const rx = Math.sin(f.seed + i * 12.9898) * .5, ry = (Math.sin(f.seed * 2 + i * 78.233) + 1) / 2;
          const start = ry * .35;                         // 위쪽부터 먼저 흩어짐
          const q = Math.max(0, (p - (1 - ry) * .3) / (1 - start));
          if (q <= 0) continue;
          const x = f.x * k + rx * wid + f.dir * q * 160 * k + Math.sin(i + q * 6) * 6 * k;
          const y = base - ry * hgt - q * 60 * k;
          ctx.globalAlpha = Math.max(0, 1 - q) * .9;
          ctx.fillStyle = i % 3 ? '#6b5a4a' : '#a89a8a';
          const sz = (3 + (i % 4)) * k + 1;
          ctx.fillRect(x, y, sz, sz);
        }
        ctx.restore();
        return;
      }
      if (f.twin) {                                       // 양손 번개가 엇갈리며 X자로 사거리 끝까지
        const hT = f.h * 1.4 * k, top = gy - hT * .62, low = gy - hT * .25;
        const x0 = f.x * k, x1 = (f.x + f.dir * f.range) * k;
        ctx.save(); ctx.globalAlpha = 1 - p;
        const bolts = [[x0 - f.dir * 30 * k, top, x1, low + 30 * k], [x0 + f.dir * 30 * k, top, x1, top - 50 * k]];
        for (const [ax, ay, bx, by] of bolts) {
          for (const [wdt, col] of [[10, 'rgba(255,90,160,.5)'], [4, '#ffe3f1']]) {
            ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(ax, ay);
            for (let i = 1; i <= 8; i++) {
              const t = i / 8, x = ax + (bx - ax) * t, y = ay + (by - ay) * t + (i < 8 ? Math.sin(i * 5.1 + f.t * 50) * 12 * k : 0);
              ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
        }
        ctx.fillStyle = 'rgba(255,150,200,.55)';
        ctx.beginPath(); ctx.arc(x1, (top + low) / 2 - 10 * k, (25 + 40 * p) * k, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }
      if (f.quake) {                                      // 착지 충격파: 땅을 따라 퍼지는 고리 + 튀는 돌
        const cx = f.x * k, gyq = gy + 4 * k;
        ctx.save(); ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 6;
        for (let i = 0; i < 3; i++) {
          const r = Math.max(4, (f.range * (p * 1.1 - i * .15)) * k);
          ctx.beginPath(); ctx.ellipse(cx, gyq, r, r * .18, 0, Math.PI, 2 * Math.PI); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(155,102,51,.55)';
        ctx.beginPath(); ctx.ellipse(cx, gyq, (60 + 140 * p) * k, (14 + 20 * p) * k, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a8a8a'; ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2;
        for (let i = 0; i < 10; i++) {
          const a = (f.seed + i * 37) % 1 * 0 + i, vx = (Math.sin(f.seed + i * 2.1)) * 220, vy = 260 + (i % 4) * 60;
          const t = p * f.dur, x = cx + vx * t * k, y = gyq - (vy * t - 600 * t * t) * k;
          if (y > gyq) continue;
          ctx.beginPath(); ctx.rect(x - 5 * k, y - 5 * k, 10 * k, 10 * k); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
        return;
      }
      if (f.beam) {                                       // 손가락 끝에서 사거리 끝까지 지그재그 번개
        const y0 = gy - f.h * 1.25 * k, x0 = (f.x + f.dir * 10) * k, x1 = (f.x + f.dir * f.range) * k;
        ctx.save(); ctx.globalAlpha = 1 - p;
        for (const [wdt, col] of [[10, 'rgba(255,230,80,.55)'], [4, '#fff7c2']]) {
          ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0);
          const segs = 9;
          for (let i = 1; i <= segs; i++) {
            const x = x0 + (x1 - x0) * i / segs, y = y0 + (i < segs ? (Math.sin(i * 7.3 + f.t * 40) * 14 * k) : 40 * k);
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,240,150,.6)'; ctx.beginPath(); ctx.arc(x1, y0 + 40 * k, (20 + 30 * p) * k, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }
      if (f.wave) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (1 - p) + ')'; ctx.lineWidth = 4;
        for (let i = 0; i < 3; i++) {
          const r = (f.range * p * (0.5 + i * 0.25)) * k + 10;
          ctx.beginPath(); ctx.arc(f.x * k, gy - 50 * k, r, f.dir < 0 ? Math.PI * .75 : -Math.PI * .25, f.dir < 0 ? Math.PI * 1.25 : Math.PI * .25); ctx.stroke();
        }
        return;
      }
      if (f.ramen) {                                      // 라면 그릇이 빙글빙글 날아가서 국물이 튐
        const yy = gy - 70 * k - Math.sin(Math.PI * p) * 70 * k;
        if (p < .85) {
          ctx.save(); ctx.translate(x, yy); ctx.rotate(f.t * 14); ctx.scale(2.2, 2.2);   // 라면 크기 2.2배
          ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2;
          ctx.fillStyle = '#e8463a'; ctx.beginPath(); ctx.moveTo(-14 * k - 2, -4 * k); ctx.lineTo(14 * k + 2, -4 * k); ctx.lineTo(9 * k + 1, 10 * k + 2); ctx.lineTo(-9 * k - 1, 10 * k + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#ffd76a'; ctx.beginPath(); ctx.ellipse(0, -4 * k, 14 * k + 2, 4 * k + 1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = '#f2c84b'; ctx.lineWidth = 2;
          for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 6 * k, -6 * k); ctx.quadraticCurveTo(i * 6 * k + 4 * k, -16 * k, i * 6 * k, -22 * k); ctx.stroke(); }
          ctx.restore();
        } else {
          const q = (p - .85) / .15;
          ctx.save(); ctx.globalAlpha = 1 - q;
          for (let i = 0; i < 8; i++) {
            const a = -Math.PI * (i / 7), r = (20 + 80 * q) * k;
            ctx.fillStyle = i % 2 ? '#e8a23a' : '#ffd76a';
            ctx.beginPath(); ctx.arc(f.tx * k + Math.cos(a) * r, gy - 30 * k + Math.sin(a) * r, 10 * k + 2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
        return;
      }
      if (f.star) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(f.t * 10);
        ctx.fillStyle = '#ffcc1f'; ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const r = (i % 2 ? 6 : 14) * k + 2, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
        return;
      }
      if (f.acorn) {
        ctx.fillStyle = '#9b6633'; ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(x, y, 7 * k + 2, 9 * k + 2, f.t * 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#5a3615'; ctx.beginPath(); ctx.ellipse(x, y - 6 * k, 8 * k + 2, 4 * k + 1, f.t * 12, 0, Math.PI * 2); ctx.fill();
        return;
      }
      if (f.fire) {
        ctx.fillStyle = '#ff9a3d'; ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 12 * k + 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(x, y, 6 * k + 1, 0, Math.PI * 2); ctx.fill();
        return;
      }
      ctx.fillStyle = '#8fd61f'; ctx.strokeStyle = '#2a1708'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 7 * k + 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
    if (S.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(.85, S.flash * 2.4) + ')'; ctx.fillRect(-10, -10, cw + 20, ch + 20); }
  }

  function hud(){
    const cb = document.getElementById('cannon'), ready = S.cannon.charge >= 1 && !S.cannon.wave && !S.over;
    cb.style.setProperty('--charge', S.cannon.charge);
    cb.classList.toggle('ready', ready);
    document.getElementById('c-txt').textContent = S.cannon.wave ? '발사!' : ready ? '발사!!' : Math.floor(S.cannon.charge * 100) + '%';
    moneyEl.textContent = Math.floor(S.money);
    walletEl.textContent = S.walletMax;
    const wb = document.getElementById('worker'), max = S.workerLv >= S.workerMax;
    document.getElementById('w-lv').textContent = max ? 'LEVEL MAX' : 'LEVEL ' + S.workerLv;
    document.getElementById('w-cost').textContent = max ? 'MAX' : workerCost() + '원';
    wb.classList.toggle('off', S.over || max || S.money < workerCost());
    S.deck.forEach(d => {
      if (!d) return;
      d.el.classList.toggle('off', d.cd > 0 || S.money < d.unit.cost || S.over);
      d.el.style.setProperty('--cd', d.cd / (d.cdMax || d.unit.cooldown));
    });
  }

  // 스피드업 (2배속 / 3배속)
  let gameSpeed = 1;
  const speedBtn = document.getElementById('speed');
  speedBtn.addEventListener('click', () => {
    gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 3 : 1;   // 1배 → 2배 → 3배 → 1배
    speedBtn.setAttribute('aria-pressed', gameSpeed > 1);
    speedBtn.classList.toggle('x3', gameSpeed === 3);
    document.getElementById('speed-txt').textContent = gameSpeed === 1 ? '스피드업' : gameSpeed + '배속';
  });

  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let i = 1; i < gameSpeed; i++) update(dt);   // 배속만큼 한 프레임에 여러 번 진행
    const eh = S.enemyBase.hp, chp = S.catBase.hp;
    update(dt);
    S.enemyBase.hit = S.enemyBase.hp < eh; S.catBase.hit = S.catBase.hp < chp;
    draw(); hud();
    if (!battle.hidden) raf = requestAnimationFrame(loop);
  }

  const stagesEl = document.getElementById('stages'), cardsEl = document.getElementById('st-cards');
  const infoEl = document.getElementById('st-info'), routeEl = document.getElementById('route');
  let sel = 0;

  // 지도 위 스테이지 점 위치 (지그재그로 15개까지)
  function stagePos(i){                         // 48개: 한 줄에 8개씩 지그재그 6줄
    const row = Math.floor(i / 8), col = i % 8;
    return { x: 60 + (row % 2 ? 7 - col : col) * 80, y: 205 + row * 40 };
  }
  // 클리어한 스테이지 + 다음에 도전할 스테이지 1개만 보이게
  let curCh = 1;
  function chapterStages(ch){ return chapterStageList(ch); }
  // 앞 장의 마지막 스테이지를 깨야 다음 장이 열림
  function chapterOpen(ch){ return chapterUnlocked(ch); }
  function openStages(){
    const list = chapterStages(curCh);
    let n = 0;
    while (n < list.length && PLAYER.cleared.includes(list[n].key)) n++;
    return list.slice(0, Math.min(list.length, n + 1));
  }
  function renderChapterTabs(){
    const box = document.getElementById('ch-tabs');
    box.innerHTML = '<span class="ch-world">' + WORLD_NAME + '</span>';
    CHAPTERS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'ch-tab' + (c.no === curCh ? ' on' : '');
      b.textContent = c.name;
      b.disabled = !chapterOpen(c.no);
      b.title = chapterOpen(c.no) ? '' : '앞 장을 모두 깨면 열려요';
      b.addEventListener('click', () => { curCh = c.no; sel = Math.max(0, openStages().length - 1); renderStages(); });
      box.appendChild(b);
    });
  }

  function renderStages(){
    const list = openStages();
    sel = Math.min(sel, list.length - 1);
    document.getElementById('s-money').textContent = moneyText();

    cardsEl.innerHTML = '';
    list.forEach((st, i) => {
      const cleared = PLAYER.cleared.includes(st.key);
      const b = document.createElement('button');
      b.className = 'st-card' + (i === sel ? ' center' : '') + (stageLabel(st).length > 6 ? ' long' : '');
      b.style.setProperty('--off', i - sel);
      b.innerHTML = (cleared ? '<span class="clear">CLEAR!</span><svg class="star" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#ff9a3d" stroke="#2a1708" stroke-width="3"/><path d="M20 8 L23 16 L32 16 L25 21 L28 30 L20 25 L12 30 L15 21 L8 16 L17 16 Z" fill="#ffcc1f" stroke="#2a1708" stroke-width="2"/></svg>' : '') + '<span class="st-label">' + stageLabel(st) + '</span>';
      b.addEventListener('click', () => { sel = i; renderStages(); });
      cardsEl.appendChild(b);
    });

    const st = list[sel];
    const cnt = (PLAYER.clearCount || {})[st.key] || 0;
    const notYet = !PLAYER.cleared.includes(st.key);
    const ticket = st.reward.rareTicket ? '레어 티켓 ' + st.reward.rareTicket : st.reward.nyankoTicket ? '냥코 티켓 ' + st.reward.nyankoTicket : '';
    infoEl.innerHTML = '<span>클리어</span><b>' + cnt + ' 회</b><span>보상 돈</span><b>' + st.reward.money.toLocaleString() + '</b>' +
      (notYet && ticket ? '<span>최초 클리어</span><b>' + ticket + '</b>' : '');

    // 지도: 점선 길 + 빨간 점 + 고양이
    let svg = '';
    for (let i = 1; i < list.length; i++) {
      const p = stagePos(i - 1), q = stagePos(i);
      svg += '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y + '" stroke="#fff" stroke-width="5" stroke-dasharray="0 12" stroke-linecap="round"/>';
    }
    list.forEach((s2, i) => {
      const p = stagePos(i);
      svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="9" fill="#ff3b30" stroke="#fff" stroke-width="4"/>';
    });
    const c = stagePos(sel);
    svg += '<ellipse cx="' + c.x + '" cy="' + (c.y + 26) + '" rx="30" ry="8" fill="rgba(0,0,0,.25)"/>' +
      '<use href="#soldier" transform="translate(' + (c.x - 32) + ',' + (c.y - 44) + ') scale(.27)"/>';
    routeEl.innerHTML = svg;
  }

  document.getElementById('btn-battle').addEventListener('click', () => {
    curCh = chapterOpen(SELECTED_CH) ? SELECTED_CH : 1;
    sel = openStages().length - 1; renderStages(); stagesEl.hidden = false;
  });
  document.getElementById('btn-stage-back').addEventListener('click', () => { stagesEl.hidden = true; });
  document.getElementById('btn-go').addEventListener('click', () => {
    const ov = document.getElementById('go-overlay');
    ov.hidden = false;
    setTimeout(() => { ov.hidden = true; stagesEl.hidden = true; start(openStages()[sel]); }, 1100);
  });
  renderPlayer();
  document.getElementById('btn-exit').addEventListener('click', () => { battle.hidden = true; cancelAnimationFrame(raf); });
})();
</script>

</body></html>
