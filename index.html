<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>고양이 대전쟁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">
<style>
/* Layout: one 16:9 game stage scaled to fit; loading layer fades into the base (home) layer */
:root{
  color-scheme: dark;
  --page:#120d09;
  --wall-a:#5c9a73; --wall-b:#3f7a58; --wall-line:#2f6347;
  --wood:#9b6633; --wood-hi:#c48a4c; --wood-dark:#5a3615;
  --btn-hi:#fff6b8; --btn:#ffcc1f; --btn-lo:#e08e00;
  --green-hi:#eaffb5; --green:#8fd61f; --green-lo:#4f8a0a;
  --red-hi:#ffd0c4; --red:#ff6a3d; --red-lo:#b8330f;
  --ink:#2a1708; --cream:#fff7e6; --sky:#8fd3ff; --sky-lo:#3a9be6;
  --display:"Black Han Sans","Jua",system-ui,sans-serif;
  --body:"Jua",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page);color:var(--cream);font-family:var(--body);margin:0;
  display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage{position:relative;width:min(100%, calc((100vh - 32px) * 16 / 9));max-width:100%;aspect-ratio:16/9;
  container-type:inline-size;overflow:hidden;border-radius:1.4cqw;user-select:none;
  box-shadow:0 0 0 .5cqw var(--ink),0 1.5cqw 5cqw rgba(0,0,0,.7)}
.outline{color:var(--cream);-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill}

/* ---------- Loading ---------- */
.loading{position:absolute;inset:0;z-index:5;overflow:hidden;transition:opacity .6s, transform .6s;
  background:linear-gradient(var(--sky-lo),var(--sky) 60%,#d8f1ff)}
.loading.done{opacity:0;transform:scale(1.06);pointer-events:none}
.sun{position:absolute;left:50%;top:-30cqw;width:80cqw;height:80cqw;margin-left:-40cqw;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.22) 0 8deg, transparent 8deg 18deg);animation:spin 30s linear infinite}
.cloud{position:absolute;height:5cqw;background:#fff;border-radius:5cqw;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:6cqw;height:6cqw;left:2cqw;top:-3cqw}
.cloud::after{width:8cqw;height:8cqw;left:6cqw;top:-5cqw}
.c1{width:18cqw;top:14cqw;left:-20cqw;animation-duration:22s}
.c2{width:14cqw;top:30cqw;left:-20cqw;animation-duration:30s;animation-delay:-12s}
.c3{width:20cqw;top:8cqw;left:-20cqw;animation-duration:26s;animation-delay:-20s}
.ground{position:absolute;left:0;right:0;bottom:0;height:12cqw;background:linear-gradient(#7fd04a,#4e9a26);border-top:.5cqw solid var(--ink)}
.ground::before{content:"";position:absolute;left:0;right:0;top:-1.6cqw;height:2cqw;
  background:radial-gradient(circle at 1cqw 2cqw,#7fd04a 1cqw,transparent 1.05cqw) 0 0/2cqw 2cqw repeat-x}
.logo-wrap{position:absolute;left:0;right:0;top:9cqw;text-align:center;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo{display:inline-block;font-family:var(--display);font-size:10cqw;line-height:1;transform:rotate(-3deg);
  background:linear-gradient(var(--btn-hi),var(--btn) 50%,var(--btn-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(.5cqw 0 0 var(--ink)) drop-shadow(-.5cqw 0 0 var(--ink)) drop-shadow(0 .5cqw 0 var(--ink)) drop-shadow(0 -.5cqw 0 var(--ink)) drop-shadow(0 1.2cqw 0 var(--ink))}
.sub{margin-top:1.6cqw;font-family:var(--display);font-size:2.4cqw;letter-spacing:1.2cqw;color:var(--ink)}
.march{position:absolute;bottom:10.5cqw;left:-16cqw;width:13cqw;animation:march 6s linear infinite}
.march svg{width:100%;height:auto;animation:hop .35s ease-in-out infinite alternate}
.loadbox{position:absolute;left:50%;bottom:2.6cqw;transform:translateX(-50%);display:flex;align-items:center;gap:1.5cqw}
.bar{width:46cqw;height:3.2cqw;border:.5cqw solid var(--ink);border-radius:3cqw;background:var(--cream);overflow:hidden;box-shadow:0 .5cqw 0 var(--ink)}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--btn) 0 1.6cqw,var(--btn-lo) 1.6cqw 3.2cqw);background-size:4.5cqw 100%;animation:stripes .6s linear infinite}
.pct{font-family:var(--display);font-size:3cqw;min-width:8cqw;font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(140cqw)}}
@keyframes drop{from{transform:translateY(-30cqw)}}
@keyframes march{to{transform:translateX(130cqw)}}
@keyframes hop{to{transform:translateY(-1.2cqw) rotate(4deg)}}
@keyframes stripes{to{background-position:4.5cqw 0}}

/* ---------- Home (고양이 기지) ---------- */
.home{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 55%,var(--wall-a),var(--wall-b) 75%)}
.pattern{position:absolute;inset:0;opacity:.55;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 1.5cqw, var(--wall-line) 1.6cqw 1.95cqw, transparent 2.05cqw 2.75cqw, var(--wall-line) 2.85cqw 3.2cqw, transparent 3.3cqw),
    radial-gradient(circle at 0 0, transparent 1.5cqw, var(--wall-line) 1.6cqw 1.95cqw, transparent 2.05cqw 2.75cqw, var(--wall-line) 2.85cqw 3.2cqw, transparent 3.3cqw);
  background-size:8cqw 8cqw}
.pillar{position:absolute;top:0;bottom:0;width:4cqw;background:linear-gradient(90deg,var(--wood-dark),var(--wood) 30%,var(--wood-hi) 50%,var(--wood) 70%,var(--wood-dark));border-inline:.4cqw solid var(--ink)}
.pillar.l{left:41cqw}.pillar.r{left:78cqw}
.floor{position:absolute;left:0;right:0;bottom:0;height:9cqw;border-top:.5cqw solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--wood) 0 11cqw,var(--wood-dark) 11cqw 11.3cqw),linear-gradient(var(--wood-hi),var(--wood-dark))}
.floor{background-blend-mode:multiply}
.topbar{position:absolute;left:0;right:0;top:0;height:7cqw;display:flex;align-items:center;gap:1.4cqw;padding-left:2cqw;
  background:linear-gradient(var(--wood-hi),var(--wood) 55%,var(--wood-dark));border-bottom:.5cqw solid var(--ink);box-shadow:0 .6cqw 0 rgba(0,0,0,.25)}
.topbar h1{margin:0;font-family:var(--display);font-weight:400;font-size:3.8cqw}
.paw{width:4cqw;height:4cqw}

.menu{position:absolute;left:2.5cqw;top:11.5cqw;display:flex;flex-direction:column;gap:2.2cqw;width:35cqw}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:1.2cqw;cursor:pointer;
  font-family:var(--display);font-weight:400;font-size:4.2cqw;color:var(--ink);
  background:linear-gradient(var(--btn-hi),var(--btn) 48%,var(--btn-lo));
  border:.55cqw solid var(--ink);border-radius:2cqw;padding:1.2cqw 0 1.4cqw;
  box-shadow:inset 0 -.8cqw 0 rgba(0,0,0,.15),0 .8cqw 0 var(--ink);transition:transform .07s,box-shadow .07s,filter .15s}
.btn::after{content:"";position:absolute;left:4%;right:4%;top:.5cqw;height:35%;border-radius:1.4cqw;background:rgba(255,255,255,.45);pointer-events:none}
.btn.battle{font-size:5cqw;padding:1.8cqw 0 2cqw;background:linear-gradient(var(--red-hi),var(--red) 48%,var(--red-lo));color:var(--cream);-webkit-text-stroke:.4cqw var(--ink);paint-order:stroke fill}
.btn.battle{animation:pulse 1.4s ease-in-out infinite}
.btn svg{width:4.2cqw;height:4.2cqw;flex:none}
.btn:hover,.gacha:hover{filter:brightness(1.07)}
.btn:active,.gacha:active{transform:translateY(.7cqw);box-shadow:inset 0 -.8cqw 0 rgba(0,0,0,.15),0 .1cqw 0 var(--ink)}
.btn:focus-visible,.gacha:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.5cqw}
@keyframes pulse{50%{transform:scale(1.03)}}

.gachas{position:absolute;left:46.5cqw;bottom:3cqw;display:flex;gap:2.4cqw}
.gacha{position:relative;width:13cqw;height:13cqw;padding:0;border:none;background:none;cursor:pointer;transition:transform .07s,filter .15s}
.gacha svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .8cqw 0 var(--ink))}
.gacha span{position:absolute;left:0;right:0;bottom:2.6cqw;font-family:var(--display);font-size:2.6cqw;line-height:1.05;color:var(--cream);-webkit-text-stroke:.38cqw var(--ink);paint-order:stroke fill}
.gacha.rare{animation:shine 2s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.15) drop-shadow(0 0 1.2cqw #fff3a0)}}

.home-cat{position:absolute;right:-1cqw;bottom:2cqw;width:27cqw;transform-origin:50% 100%;animation:breathe 2.4s ease-in-out infinite}
.home-cat svg{width:100%;height:auto;display:block}
.shadow{position:absolute;right:3cqw;bottom:1.6cqw;width:20cqw;height:3cqw;border-radius:50%;background:rgba(0,0,0,.3)}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
/* ---------- Power-up (파워업) ---------- */
.power{position:absolute;inset:0;z-index:3;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#fff2c2,#f3cf7a 70%,#d9a548)}
.power .topbar{gap:0}
.p-label{position:absolute;left:0;top:8.5cqw;padding:.6cqw 6cqw .6cqw 2.5cqw;font-family:var(--display);font-size:2.6cqw;color:var(--ink);
  background:var(--cream);border:.4cqw solid var(--ink);border-left:none;border-radius:0 3cqw 3cqw 0}
.carousel{position:absolute;left:0;right:0;top:13cqw;height:22cqw;display:flex;align-items:center;justify-content:center}
.c-track{position:relative;width:100%;height:100%}
.card{position:absolute;top:50%;left:50%;width:18cqw;height:17cqw;cursor:pointer;padding:0;
  border:.5cqw solid var(--ink);border-radius:1cqw;background:var(--cream);box-shadow:0 .5cqw 0 var(--ink);
  transform:translate(-50%,-50%) translateX(calc(var(--off) * 22cqw)) scale(.82);transition:transform .25s,opacity .25s;opacity:.85;overflow:hidden}
.card.center{width:24cqw;height:21cqw;transform:translate(-50%,-50%) scale(1);opacity:1;z-index:2;
  box-shadow:0 0 0 .6cqw var(--btn),0 .7cqw 0 var(--ink)}
.card-name{display:block;background:var(--wood);color:var(--cream);font-family:var(--display);font-size:2.2cqw;padding:.5cqw 0;border-bottom:.4cqw solid var(--ink);
  -webkit-text-stroke:.25cqw var(--ink);paint-order:stroke fill}
.card-art{display:flex;align-items:center;justify-content:center;height:calc(100% - 7.6cqw)}
.card-art svg{height:100%;width:auto}
.card-lv{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:1cqw;padding:.5cqw 1.2cqw;
  font-family:var(--display);color:var(--ink);font-size:1.8cqw;background:rgba(255,204,31,.35);border-top:.3cqw solid var(--ink)}
.card-lv b{font-weight:400;font-size:3cqw;color:var(--cream);-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill}
.card:not(.center) .card-lv b{font-size:2.2cqw}
.lvnum{display:flex;flex-direction:column;align-items:flex-end;line-height:.95}
.lvnum i{font-style:normal;font-family:var(--display);font-size:2.4cqw;color:var(--btn);-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill}
.lvnum i:empty{display:none}
.card:not(.center) .lvnum i{font-size:1.8cqw}
.arrow{position:absolute;top:50%;z-index:3;width:4cqw;height:7cqw;transform:translateY(-50%);cursor:pointer;border:.45cqw solid var(--ink);
  background:linear-gradient(#7fb7ff,#3a7be0);box-shadow:0 .4cqw 0 var(--ink);padding:0}
.arrow.l{left:1cqw;border-radius:0 1.4cqw 1.4cqw 0;clip-path:inset(-1cqw)}
.arrow.r{right:1cqw;border-radius:1.4cqw 0 0 1.4cqw}
.arrow svg{width:100%;height:100%;display:block}
.arrow:disabled{opacity:.35;cursor:default}
.p-bottom{position:absolute;left:2.5cqw;right:2.5cqw;bottom:9cqw;height:13.5cqw;display:flex;align-items:flex-end;gap:2cqw}
.btn.powerup{width:30cqw;flex:none;align-self:flex-start;font-size:4.6cqw;padding:1.4cqw 0 1.6cqw}
.desc{flex:1;min-width:0;align-self:stretch;margin-top:5cqw;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:1cqw 2cqw;background:#6b4325;color:var(--cream);border:.5cqw solid var(--ink);border-radius:1.6cqw;font-size:2.3cqw;line-height:1.4}
.back{position:absolute;left:2cqw;bottom:1.5cqw;z-index:4;width:7cqw;height:7cqw;padding:1cqw;border:.5cqw solid var(--ink);border-radius:50%;cursor:pointer;
  background:linear-gradient(var(--btn-hi),var(--btn) 50%,var(--btn-lo));box-shadow:0 .5cqw 0 var(--ink)}
.back svg{width:100%;height:100%;display:block}
.back:active,.arrow:active:not(:disabled){transform:translateY(calc(-50% + .4cqw));box-shadow:none}
.back:active{transform:translateY(.4cqw)}
.back:focus-visible,.card:focus-visible,.arrow:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.card .folder{height:80%;width:auto}
.card.back{background:#e8dcc4}
.back-name{background:#8a8a8a!important}
.btn.powerup:disabled{filter:grayscale(.8) brightness(.9);cursor:default}
.power .floor{height:6cqw}
/* ---------- Battle (전투) ---------- */
.battle-screen{position:absolute;inset:0;z-index:4;background:var(--sky)}
.field{position:absolute;inset:0}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-tag{position:absolute;left:2cqw;top:1.5cqw;font-family:var(--display);font-size:3cqw;padding:.3cqw 1.6cqw;
  background:var(--wood);border:.45cqw solid var(--ink);border-radius:3cqw}
.speed{position:absolute;right:2.5cqw;top:7.4cqw;z-index:2;display:flex;align-items:center;gap:.6cqw;cursor:pointer;
  padding:.4cqw 1.4cqw;font-family:var(--display);font-size:2.2cqw;color:var(--cream);
  background:linear-gradient(#7fb7ff,#3a7be0);border:.4cqw solid var(--ink);border-radius:3cqw;box-shadow:0 .4cqw 0 var(--ink)}
.speed svg{width:3.2cqw;height:2cqw;color:var(--cream)}
.speed[aria-pressed="true"]{background:linear-gradient(var(--btn-hi),var(--btn) 50%,var(--btn-lo));color:var(--ink)}
.speed[aria-pressed="true"] svg{color:var(--red)}
.speed.x3{background:linear-gradient(var(--red-hi),var(--red) 50%,var(--red-lo));color:var(--cream)}
.speed.x3 svg{color:var(--btn)}
.speed:active{transform:translateY(.4cqw);box-shadow:none}
.speed:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.money{position:absolute;right:2.5cqw;top:1.2cqw;z-index:2;font-family:var(--display);font-size:4.4cqw;font-variant-numeric:tabular-nums;
  color:var(--btn);-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;letter-spacing:.1cqw}
.cannon{position:absolute;right:1.5cqw;bottom:1cqw;z-index:2;width:16cqw;height:16cqw;padding:0;cursor:pointer;border-radius:50%;overflow:hidden;
  background:#3a3640;border:.6cqw solid var(--ink);box-shadow:0 .6cqw 0 var(--ink)}
.c-fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--charge,0) * 100%);background:linear-gradient(#ff9ad0,#e8468a)}
.cannon svg{position:absolute;inset:12%;width:76%;height:76%}
.c-txt{position:absolute;left:0;right:0;bottom:2cqw;font-family:var(--display);font-size:2.3cqw;text-align:center}
.cannon.ready{animation:cready .6s ease-in-out infinite alternate}
.cannon.ready .c-fill{background:linear-gradient(#fff3a6,var(--btn) 50%,var(--btn-lo))}
@keyframes cready{to{box-shadow:0 .6cqw 0 var(--ink),0 0 2cqw .6cqw rgba(255,204,31,.8)}}
.cannon:not(.ready){cursor:default}
.cannon.ready:active{transform:translateY(.5cqw);box-shadow:none}
.cannon:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.worker{position:absolute;left:1.5cqw;bottom:1cqw;z-index:2;width:17cqw;height:17cqw;padding:3.4cqw 2.4cqw 4.2cqw;cursor:pointer;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,var(--btn-hi),var(--btn) 55%,var(--btn-lo));border:.6cqw solid var(--ink);box-shadow:0 .6cqw 0 var(--ink)}
.worker svg{width:100%;height:100%;display:block}
.w-lv{position:absolute;left:50%;top:-2.6cqw;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:2.4cqw;
  color:var(--cream);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}
.w-cost{position:absolute;left:0;right:0;bottom:1.6cqw;font-family:var(--display);font-size:2.6cqw;color:var(--cream);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}
.worker.off{filter:grayscale(.85) brightness(.85);cursor:default}
.worker:not(.off):active{transform:translateY(.5cqw);box-shadow:none}
.worker:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.slots{position:absolute;left:50%;bottom:1cqw;z-index:2;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,7.4cqw);gap:.8cqw}
.slot{position:relative;width:7.4cqw;height:6.1cqw;padding:0;cursor:pointer;overflow:hidden;
  background:linear-gradient(var(--btn-hi),var(--btn));border:.35cqw solid var(--ink);border-radius:.5cqw}
.slot.empty{background:rgba(42,23,8,.35);border-color:rgba(42,23,8,.6);cursor:default}
.slot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot .cost{position:absolute;right:.5cqw;bottom:.1cqw;font-family:var(--display);font-size:1.7cqw;color:var(--cream);-webkit-text-stroke:.28cqw var(--ink);paint-order:stroke fill}
.slot .cd{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0) * 100%);background:rgba(42,23,8,.55);pointer-events:none}
.slot.off{filter:grayscale(.9) brightness(.8);cursor:default}
.slot:not(.off):not(.empty):active{transform:translateY(.4cqw)}
.slot:focus-visible,.result .btn:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.result{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:rgba(42,23,8,.6)}
.result h2{margin:0;font-family:var(--display);font-weight:400;font-size:11cqw;line-height:1;color:var(--btn);-webkit-text-stroke:.7cqw var(--ink);paint-order:stroke fill;
  animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
.result.lose h2{color:#9fb3c8}
.result .btn{width:34cqw}
/* ---------- 보유 재화 / 스테이지 선택 / 보상 ---------- */
.wallet-bar{margin-left:auto;margin-right:1.5cqw;display:flex;gap:1cqw}
.pill{display:flex;align-items:center;gap:.6cqw;padding:.4cqw 1.2cqw;background:var(--ink);border-radius:3cqw;font-size:1.9cqw;color:var(--cream)}
.pill b{font-family:var(--display);font-weight:400;font-size:2.4cqw;color:var(--btn);font-variant-numeric:tabular-nums}
.pill svg{width:2.6cqw;height:2.6cqw}
.pill.ticket b{color:var(--green)}
.pill.rare b{color:var(--btn)}
.stages{position:absolute;inset:0;z-index:3;background:var(--wood-dark)}
.ch-tabs{display:flex;align-items:center;gap:.8cqw;margin-left:2cqw}
.ch-world{font-family:var(--display);font-size:2.2cqw;color:var(--btn);-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill;margin-right:.4cqw}
.ch-tab{padding:.3cqw 1.4cqw;cursor:pointer;font-family:var(--display);font-size:2cqw;color:var(--ink);background:#e8dcc4;border:.35cqw solid var(--ink);border-radius:2cqw}
.ch-tab.on{background:var(--btn);box-shadow:0 0 0 .3cqw var(--cream)}

.map{position:absolute;left:0;right:0;top:7cqw;bottom:6cqw;overflow:hidden;border-block:.5cqw solid var(--ink);

    radial-gradient(ellipse 30cqw 14cqw at 22% 40%, rgba(150,105,50,.28), transparent 70%),

.route{position:absolute;inset:0;width:100%;height:100%}
.st-cards{position:absolute;left:0;right:0;top:1.5cqw;height:15cqw}

.st-info{position:absolute;left:50%;top:9.5cqw;transform:translateX(-50%);display:grid;grid-template-columns:auto auto;gap:.2cqw 3cqw;

.go{position:absolute;right:3cqw;top:24cqw;width:31cqw;font-size:4.6cqw;padding:1.6cqw 0 1.8cqw}

.rewards{display:flex;flex-direction:column;align-items:center;gap:.8cqw;font-family:var(--display);font-size:3cqw;color:var(--cream);-webkit-text-stroke:.3cqw var(--ink);paint-order:stroke fill}

.p-cost{position:absolute;left:50%;top:35.5cqw;transform:translateX(-50%);z-index:3;white-space:nowrap;display:flex;align-items:center;gap:1cqw;

.card.bump{animation:bump .35s ease-out}

/* ---------- 냥코 뽑기 화면 ---------- */

  background:var(--cream);border:.45cqw solid var(--ink);border-radius:3cqw;box-shadow:0 0 0 .4cqw var(--btn)}

.g-spot{position:absolute;left:50%;top:38cqw;width:26cqw;height:4cqw;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.3)}

  background:linear-gradient(var(--btn-hi),var(--btn) 50%,var(--btn-lo));border:.5cqw solid var(--ink);border-radius:1.4cqw;box-shadow:0 .6cqw 0 var(--ink)}
.g-roll .t{display:block;font-family:var(--display);font-size:3.4cqw;color:var(--ink)}
.g-roll .t em{font-style:normal;color:var(--red);-webkit-text-stroke:.25cqw var(--ink);paint-order:stroke fill}
.g-roll .n{position:absolute;right:1.6cqw;bottom:.8cqw;display:flex;align-items:center;gap:.8cqw;font-family:var(--display);font-size:3.2cqw;color:var(--cream);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}
.ticket-ic{width:5cqw;height:3cqw}
.g-roll:disabled{filter:grayscale(.8) brightness(.85);cursor:default}
.g-roll:not(:disabled):active{transform:translateY(.5cqw);box-shadow:none}
.g-roll:focus-visible,.g-ok:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.4cqw}
.g-bottom{position:absolute;left:0;right:0;bottom:0;height:6cqw;display:flex;align-items:center;justify-content:flex-end;gap:1cqw;padding-right:2.5cqw;

.gacha-screen .back{bottom:1cqw;z-index:3}

/* 연출 */
.g-show{position:absolute;inset:0;z-index:5;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#9b5cd6,#4a1f7a 70%,#26103f)}
.g-show .topbar{z-index:2}
.claw{position:absolute;top:0;width:calc(var(--s) * 18cqw);transform:translateX(-50%) translateY(-110%);animation:clawDown .7s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:var(--d)}
.claw svg{width:100%;height:auto;display:block}
.claw .ball{transform-box:fill-box;transform-origin:50% 50%;animation:ballSpin 1.5s cubic-bezier(.55,0,.85,.35) .85s forwards}
@keyframes clawDown{to{transform:translateX(-50%) translateY(0)}}
@keyframes ballSpin{to{transform:rotate(1440deg)}}
.sparks{position:absolute;inset:0;opacity:0;animation:spark .18s steps(2) infinite;animation-delay:1.1s}
@keyframes spark{0%{opacity:0}50%{opacity:1}}
.g-rays{position:absolute;left:50%;top:58%;width:160cqw;height:160cqw;margin:-80cqw 0 0 -80cqw;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(rgba(255,255,255,.28) 0 7deg, transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);
  animation:raysIn .4s ease-out .8s forwards, raysSpin 1.6s linear .8s infinite}
@keyframes raysIn{to{opacity:1}}
@keyframes raysSpin{to{transform:rotate(360deg)}}
.g-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.g-flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* 결과 */
.g-result{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;
  background:radial-gradient(ellipse at 50% 45%,#fff3c4,#f3b93a 55%,#b06a10)}
.g-cards{position:relative;z-index:2;display:grid;gap:1.4cqw;grid-template-columns:repeat(var(--cols),auto)}
.g-result{overflow:hidden}
.g-result .g-ok{position:relative;z-index:2}
.g-result::before,.g-result::after{content:"";position:absolute;pointer-events:none;opacity:0}
/* 레어: 무난한 보랏빛 */
.g-result.bg-rare{background:radial-gradient(ellipse at 50% 45%,#efe6ff,#b7a3dc 60%,#6e5a96)}
/* 슈퍼레어: 따뜻한 주황 + 은은한 빛 */
.g-result.bg-super{background:radial-gradient(ellipse at 50% 45%,#fff1d6,#ffb04a 55%,#c25a10)}
.g-result.bg-super::before{opacity:.5;left:50%;top:45%;width:160cqw;height:160cqw;margin:-80cqw 0 0 -80cqw;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.25) 0 6deg,transparent 6deg 24deg);animation:raysSpin 20s linear infinite}
/* 울트라슈퍼레어: 빛나는 빨강·금색 + 회전하는 빛줄기 + 반짝임 */
.g-result.bg-uber{background:radial-gradient(ellipse at 50% 45%,#fff8d6,#ff7a5a 50%,#8a0f2a)}
.g-result.bg-uber::before{opacity:1;left:50%;top:45%;width:180cqw;height:180cqw;margin:-90cqw 0 0 -90cqw;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,240,180,.55) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);animation:raysSpin 6s linear infinite}
.g-result.bg-uber::after{opacity:1;inset:0;background:
  radial-gradient(circle at 20% 30%,#fff 0 .4cqw,transparent .6cqw),radial-gradient(circle at 78% 22%,#fff 0 .5cqw,transparent .7cqw),
  radial-gradient(circle at 70% 75%,#fff 0 .4cqw,transparent .6cqw),radial-gradient(circle at 28% 78%,#fff 0 .3cqw,transparent .5cqw);
  animation:twinkle 1.2s ease-in-out infinite alternate}
/* 레전드레어: 무지개 소용돌이 + 빠른 빛줄기 + 반짝임 + 맥동 */
.g-result.bg-legend{background:conic-gradient(from 0deg at 50% 45%,#ff5f7e,#ffcc1f,#8fd61f,#3ac0e0,#8a5cff,#ff5fd0,#ff5f7e)}
.g-result.bg-legend::before{opacity:1;left:50%;top:45%;width:200cqw;height:200cqw;margin:-100cqw 0 0 -100cqw;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.75) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 5%,transparent 50%);mask:radial-gradient(circle,#000 5%,transparent 50%);animation:raysSpin 2.5s linear infinite}
.g-result.bg-legend::after{opacity:1;inset:0;background:
  radial-gradient(circle at 50% 45%,rgba(255,255,255,.85),transparent 35%),
  radial-gradient(circle at 15% 25%,#fff 0 .6cqw,transparent .9cqw),radial-gradient(circle at 85% 20%,#fff 0 .7cqw,transparent 1cqw),
  radial-gradient(circle at 80% 80%,#fff 0 .6cqw,transparent .9cqw),radial-gradient(circle at 20% 82%,#fff 0 .5cqw,transparent .8cqw),
  radial-gradient(circle at 50% 12%,#fff 0 .5cqw,transparent .8cqw);
  animation:legendPulse .8s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
@keyframes legendPulse{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.04)}}
.g-card{position:relative;width:var(--w);padding:1.2cqw 1cqw 1cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;
  background:var(--cream);border:.5cqw solid var(--ink);border-radius:1.4cqw;box-shadow:0 .6cqw 0 var(--ink);animation:gpop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gpop{from{transform:scale(.3);opacity:0}}
.g-card svg{width:80%;height:auto;display:block}
.g-card .nm{font-family:var(--display);font-size:var(--fs);color:var(--ink);white-space:nowrap}
.g-card .tag{position:absolute;top:-1.8cqw;left:50%;transform:translateX(-50%) rotate(-6deg);white-space:nowrap;font-family:var(--display);font-size:calc(var(--fs) * 1.1);
  color:var(--red);-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}

.g-item{display:flex;flex-direction:column;align-items:center;gap:2.6cqw;animation:gpop .4s cubic-bezier(.3,1.6,.5,1) both}
.g-item .g-card{animation:none}
.rar-big{font-family:var(--display);font-size:calc(var(--fs) * 1.6);line-height:1;white-space:nowrap;-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill;text-shadow:0 .4cqw 0 var(--ink)}
.g-card.r-legend{box-shadow:0 0 0 .5cqw #c58bff,0 0 2.5cqw .8cqw rgba(197,139,255,.8),0 .6cqw 0 var(--ink)}
.g-card.r-uber{box-shadow:0 0 0 .5cqw #ff5f7e,0 .6cqw 0 var(--ink)}
.g-card .money-got{font-family:var(--display);font-size:calc(var(--fs) * .9);color:var(--btn-lo)}
.g-ok{width:22cqw;font-size:3.2cqw;padding:.8cqw 0 1cqw}
.g-show{z-index:8}.g-result{z-index:9}
.g-show.rare{background:radial-gradient(ellipse at 50% 60%,#ffd76a,#b8621a 65%,#5a2a0a)}
.r-rates{margin-left:auto;margin-right:1.6cqw;border-collapse:collapse;background:var(--ink);border:.35cqw solid var(--cream);border-radius:1cqw;overflow:hidden;font-variant-numeric:tabular-nums}
.r-rates th,.r-rates td{padding:.05cqw 1.1cqw;text-align:center;line-height:1.25}
.r-rates th{font-weight:400;font-size:1.4cqw;color:var(--cream)}
.r-rates td{font-family:var(--display);font-size:2cqw;color:var(--btn)}
.r-rates th:nth-child(2),.r-rates td:nth-child(2){color:#ff9a3d}
.r-rates th:nth-child(3),.r-rates td:nth-child(3){color:#ff5f7e}
.r-rates th:nth-child(4),.r-rates td:nth-child(4){color:#c58bff}
.rare-screen{position:absolute;inset:0;z-index:4;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#8a4fc4,#3f1d6b 65%,#1f0e38)}
.rare-screen .topbar,.rare-screen .back{z-index:3}
.r-tabs{position:absolute;left:2cqw;right:2cqw;top:8.4cqw;display:flex;gap:1cqw;z-index:3;overflow-x:auto;padding:.4cqw .4cqw 1cqw}
.r-tab{flex:none;padding:.5cqw 1.8cqw;cursor:pointer;font-family:var(--display);font-size:2.2cqw;color:var(--ink);
  background:#d9d0e6;border:.4cqw solid var(--ink);border-radius:3cqw;opacity:.75}
.r-tab.on{background:var(--cream);opacity:1;box-shadow:0 0 0 .45cqw var(--btn)}
.r-tab:focus-visible,.g-arrow:focus-visible{outline:.5cqw solid var(--cream);outline-offset:.3cqw}

.rare-screen .g-arrow{top:21cqw}
.r-banner{position:absolute;left:12cqw;right:12cqw;top:14.5cqw;height:18cqw;overflow:hidden;border:.55cqw solid var(--ink);border-radius:1.6cqw;

.r-title{position:absolute;left:4cqw;top:3.2cqw;font-family:var(--display);font-size:6.4cqw;line-height:1;color:var(--btn)}

.r-cap span{margin-top:-.6cqw;font-family:var(--display);font-size:1.9cqw;color:var(--cream);background:var(--ink);padding:.1cqw 1.2cqw;border-radius:2cqw}
.r-caption{position:absolute;left:0;right:0;top:34.4cqw;text-align:center;font-size:2cqw;color:#ffb3e6}
.g-roll.dark{background:linear-gradient(#6b4a2e,#3a2412);}
.g-roll.dark .t{color:var(--cream)}
.g-bottom .sep{width:2cqw}

/* ---------- 캐릭터 편성 ---------- */
.team{position:absolute;inset:0;z-index:4;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#fff2c2,#f3cf7a 70%,#d9a548)}
.t-slots{position:absolute;left:2cqw;right:2cqw;top:8cqw;padding:2.4cqw 2cqw 1.2cqw;display:flex;flex-direction:column;gap:1cqw;
  background:rgba(255,247,230,.75);border:.45cqw solid var(--ink);border-radius:1.6cqw}
.t-slot-label{position:absolute;left:2cqw;top:-1.6cqw;font-family:var(--display);font-size:2cqw;color:var(--cream);background:var(--ink);padding:.1cqw 1.4cqw;border-radius:2cqw}
.t-row{display:flex;align-items:center;gap:1.4cqw}
.t-page{width:6cqw;flex:none;text-align:center;font-family:var(--display);font-size:3.2cqw;line-height:1;color:var(--ink)}
.t-page small{display:block;font-family:var(--body);font-size:1.5cqw}
.t-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw}
.t-slot{position:relative;height:7.4cqw;padding:0;cursor:pointer;overflow:hidden;background:linear-gradient(var(--btn-hi),var(--btn));
  border:.4cqw solid var(--ink);border-radius:.6cqw}
.t-slot svg{position:absolute;inset:0;width:100%;height:100%}
.t-slot .cost{position:absolute;right:.6cqw;bottom:.1cqw;font-family:var(--display);font-size:1.8cqw;color:var(--cream);-webkit-text-stroke:.28cqw var(--ink);paint-order:stroke fill}
.t-slot.empty{background:rgba(42,23,8,.12);border-style:dashed;cursor:default}
.t-slot:not(.empty):hover{filter:brightness(1.08)}
.t-slot:focus-visible,.t-info-btn:focus-visible{outline:.5cqw solid var(--ink);outline-offset:.3cqw}
.t-slot,.team .card.unit{touch-action:none;-webkit-user-select:none;user-select:none}
.t-slot.hole{background:rgba(255,255,255,.55);border:.4cqw dashed var(--red);box-shadow:inset 0 0 0 .3cqw rgba(255,95,95,.3)}
.t-slot.shifted{animation:shiftIn .22s ease-out}
@keyframes shiftIn{from{transform:translateX(-60%);opacity:.4}}

<script>
// ---------- 캐릭터 데이터 ----------
// rarity: 'basic'(기본) | 'ex' | 'rare' | 'super' | 'uber' | 'legend'
// 레벨 규칙: 레벨이 1 오를 때마다 체력·공격력이 레벨 1 능력치의 20%씩 증가
//   능력치 = 레벨1 능력치 × (1 + 0.2 × (총레벨 - 1)),  총레벨 = 레벨 + 플러스 레벨
//   (Lv.6 = 2배, Lv.11 = 3배). 레벨은 돈(XP)으로, 플러스 레벨은 뽑기 중복으로 올림
function totalLevel(u){ return u.level + (u.plusLevel || 0); }
function statMul(u){ return 1 + 0.2 * (totalLevel(u) - 1); }
function unitHp(u){ return Math.round(u.baseHp * statMul(u)); }
function unitAp(u){ return Math.round(u.baseAp * statMul(u) * 10) / 10; }

// 전투 능력치 설명
//   kb(히트백): 죽을 때까지 밀려나는 횟수. 체력/히트백 만큼 피해를 받을 때마다 넉백(넉백 중 무적, 선딜 중이면 공격 취소)
//   foreswing(선딜) → 공격 → backswing(후딜). 공격간격(attackInterval)은 선딜이 끝난 순간부터 후딜과 동시에 진행

// ---------- 파워업 비용 (돈) ----------
// 캐릭터: (200 + 100 × (현재레벨 - 1)) × 등급 배율  → Lv1→2: 200, Lv9→10: 1,000, Lv29→30: 3,000
// 패시브: 400 × 현재레벨 (최대 20레벨, 플러스 최대 +10) → Lv1→2: 400, Lv9→10: 3,600, Lv19→20: 7,600
// 패시브 레벨 제한: 기본 Lv.10(+10), 세계편 2장(기숙사)을 다 깨면 Lv.20(+10). 대포 사정거리는 10 고정
function maxLv(u){
  if (!u.passive) return u.maxLevel;
  if (u.fixedMax) return u.fixedMax;
  return (typeof chapterCleared === 'function' && chapterCleared(2)) ? 20 : 10;
}
function pLv(id){ const u = UNITS.find(x => x.id === id); return u ? totalLevel(u) : 1; }   // 패시브 레벨 + 플러스
const RARITY_COST = { basic:1, ex:1.5, rare:1, super:1.5, uber:2, legend:3 };
function levelCost(u){
  if (u.passive) return 400 * u.level;
  return Math.round((200 + 100 * (u.level - 1)) * (RARITY_COST[u.rarity] || 1));
}

(function(){
  const track = document.getElementById('track');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  const desc = document.getElementById('desc');
  const levelBtn = document.getElementById('btn-levelup');
  let mode = 'basic';   // 'basic' = 기본 화면, 그 외 = 들어간 등급 id
  let items = [], cards = [], idx = 0, basicIdx = 0;

  function buildItems(){
    if (mode === 'basic') {
      const cats = CATEGORIES.map(c => ({ type:'cat', cat:c }));
      const basics = UNITS.filter(u => u.rarity === 'basic' && isOwned(u)).map(u => ({ type:'unit', unit:u }));
      return cats.slice().reverse().concat(basics);   // 기본 캐릭터 왼쪽에 등급 칸
    }
    const units = UNITS.filter(u => u.rarity === mode && isOwned(u)).map(u => ({ type:'unit', unit:u }));
    return units.length ? [{type:'back'}].concat(units, [{type:'back'}]) : [{type:'back'}];
  }

  function cardHTML(it){
    if (it.type === 'unit') {
      const art = it.unit.passive ? '<svg class="folder" viewBox="0 0 100 100" aria-hidden="true"><use href="#icon-' + it.unit.art + '"/></svg>'
                : '<svg viewBox="0 0 240 260" aria-hidden="true"><use href="#' + (it.unit.art || 'soldier') + '"/></svg>';
      return '<span class="card-name">' + it.unit.name + '</span>' +
        '<span class="card-art">' + art + '</span>' +
        '<span class="card-lv">레벨 <span class="lvnum"><b>' + it.unit.level + '</b><i>' + (it.unit.plusLevel ? '+' + it.unit.plusLevel : '') + '</i></span></span>';
    }
    if (it.type === 'cat') {
      const n = UNITS.filter(u => u.rarity === it.cat.id && isOwned(u)).length;
      return '<span class="card-name" style="background:' + it.cat.color + '">' + it.cat.name + '</span>' +
        '<span class="card-art"><svg class="folder" viewBox="0 0 100 80" aria-hidden="true"><path d="M8 18 H38 L46 26 H92 V72 H8 Z" fill="' + it.cat.color + '" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/><path d="M8 34 H92" stroke="#2a1708" stroke-width="4"/></svg></span>' +
        '<span class="card-lv">캐릭터 <b>' + n + '</b></span>';
    }
    return '<span class="card-name back-name">돌아가기</span>' +
      '<span class="card-art"><svg class="folder" viewBox="0 0 40 40" aria-hidden="true"><path d="M12 14 H26 A9 9 0 0 1 26 32 H16" fill="none" stroke="#2a1708" stroke-width="5" stroke-linecap="round"/><path d="M17 8 L10 14 L17 20" fill="none" stroke="#2a1708" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  function itemName(it){ return it.type === 'unit' ? it.unit.name : it.type === 'cat' ? it.cat.name : '돌아가기'; }

  function build(){
    items = buildItems();
    track.innerHTML = '';
    cards = items.map((it, i) => {
      const b = document.createElement('button');
      b.className = 'card ' + it.type;
      b.setAttribute('aria-label', itemName(it));
      b.innerHTML = cardHTML(it);
      b.addEventListener('click', () => (i === idx ? enter(it) : (idx = i, render())));
      track.appendChild(b);
      return b;
    });
    render();
  }

  function enter(it){
    if (it.type === 'cat') { basicIdx = idx; mode = it.cat.id; idx = 0; build(); }
    else if (it.type === 'back') { mode = 'basic'; idx = basicIdx; build(); }
  }

  function render(){
    cards.forEach((c, i) => {
      const off = i - idx;
      c.style.setProperty('--off', off);
      c.classList.toggle('center', off === 0);
      c.hidden = Math.abs(off) > 2;
    });
    const it = items[idx];
    if (it.type === 'unit') desc.textContent = it.unit.passive ? it.unit.fullName + ' — ' + it.unit.desc : it.unit.desc;
    else if (it.type === 'cat') desc.textContent = it.cat.name + ' 캐릭터를 모아 둔 칸입니다. 한 번 더 누르면 들어가요.';
    else desc.textContent = '기본 캐릭터 화면으로 돌아갑니다. 한 번 더 누르면 돌아가요.';
    const costEl = document.getElementById('p-cost');
    document.getElementById('pw-money').textContent = moneyText();
    if (it.type === 'unit') {
      const u = it.unit, max = u.level >= maxLv(u);
      const cost = levelCost(u);
      costEl.innerHTML = max ? '최대 레벨 <b>MAX</b>' : '필요 돈 <b>' + cost.toLocaleString() + '</b>';
      costEl.classList.toggle('short', !max && !hasMoney(cost));
      levelBtn.disabled = max || !hasMoney(cost);
    } else {
      costEl.innerHTML = '';
      levelBtn.disabled = true;
    }
    prev.disabled = idx === 0;
    next.disabled = idx === items.length - 1;
  }

  levelBtn.addEventListener('click', () => {
    const it = items[idx];
    if (it.type !== 'unit') return;
    const u = it.unit, cost = levelCost(u);
    if (u.level >= maxLv(u) || !hasMoney(cost)) return;
    spendMoney(cost);
    u.level++;
    PLAYER.levels = PLAYER.levels || {};
    PLAYER.levels[u.id] = u.level;
    savePlayer(); renderPlayer();
    const c = cards[idx];
    c.querySelector('.card-lv b').textContent = u.level;
    c.querySelector('.card-lv i').textContent = u.plusLevel ? '+' + u.plusLevel : '';
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
    render();
  });

  prev.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
  next.addEventListener('click', () => { if (idx < items.length - 1) { idx++; render(); } });

  const power = document.getElementById('power');
  document.getElementById('btn-power').addEventListener('click', () => { mode = 'basic'; idx = CATEGORIES.length; build(); power.hidden = false; });
  document.getElementById('btn-back').addEventListener('click', () => { power.hidden = true; });
})();

// ---------- 캐릭터 편성 (출진 슬롯 10칸) ----------
// PLAYER.deck 에 캐릭터 id 10칸 저장. 비어 있으면 가진 캐릭터를 순서대로 채움.
function getDeck(){
  if (!PLAYER.deck) PLAYER.deck = UNITS.filter(u => !u.passive && isOwned(u)).slice(0, 10).map(u => u.id);
  return PLAYER.deck.map(id => UNITS.find(u => u.id === id)).filter(u => u && isOwned(u));
}
(function(){
  const scr = document.getElementById('team'), track = document.getElementById('t-track');
  const prev = document.getElementById('t-prev'), next = document.getElementById('t-next');
  const hint = document.getElementById('t-hint'), info = document.getElementById('t-info');
  let mode = 'basic', items = [], cards = [], idx = 0, basicIdx = 0;

  function deckIds(){ return getDeck().map(u => u.id); }
  function setDeck(ids){ PLAYER.deck = ids; savePlayer(); }
  function art(u, crop){
    return crop ? '<svg viewBox="' + (u.iconBox || '22 24 196 168') + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#' + (u.art || 'soldier') + '"/></svg>'
                : '<svg viewBox="0 0 240 260" aria-hidden="true"><use href="#' + (u.art || 'soldier') + '"/></svg>';
  }

  // preview: 드래그 중 '밀어내기' 미리보기 { ids, hole, moved }
  function renderSlots(preview){
    const ids = preview ? preview.ids : deckIds();
    [document.getElementById('t-row1'), document.getElementById('t-row2')].forEach((row, r) => {
      row.innerHTML = '';
      for (let i = r * 5; i < r * 5 + 5; i++) {
        const u = UNITS.find(x => x.id === ids[i]);
        const b = document.createElement(u && !preview ? 'button' : 'div');
        b.dataset.i = i;
        if (preview && i === preview.hole) {
          b.className = 't-slot hole'; row.appendChild(b); continue;
        }
        if (u && preview) {
          b.className = 't-slot' + (preview.moved.includes(u.id) ? ' shifted' : '');
          b.innerHTML = art(u, true) + '<span class="cost">' + u.cost + '원</span>';
        } else if (u) {
          b.dataset.id = u.id;
          b.className = 't-slot';
          b.setAttribute('aria-label', u.name + ' 편성 해제');
          b.innerHTML = art(u, true) + '<span class="cost">' + u.cost + '원</span>';
          b.addEventListener('click', () => { if (dragJustEnded) return; setDeck(ids.filter(x => x !== u.id)); renderSlots(); render(); });
          b.addEventListener('pointerdown', e => startPress(e, u, 'slot'));
        } else {
          b.className = 't-slot empty'; b.setAttribute('aria-label', '빈 칸');
        }
        row.appendChild(b);
      }
    });
  }

  function buildItems(){
    if (mode === 'basic') {
      const cats = CATEGORIES.map(c => ({ type:'cat', cat:c }));
      const basics = UNITS.filter(u => u.rarity === 'basic' && !u.passive && isOwned(u)).map(u => ({ type:'unit', unit:u }));
      return cats.slice().reverse().concat(basics);
    }
    const units = UNITS.filter(u => u.rarity === mode && isOwned(u)).map(u => ({ type:'unit', unit:u }));
    return units.length ? [{type:'back'}].concat(units, [{type:'back'}]) : [{type:'back'}];
  }

  function cardHTML(it){
    if (it.type === 'unit') {
      const u = it.unit;
      return '<span class="card-name">' + u.name + '</span><span class="card-art">' + art(u) + '</span>' +
        '<span class="card-lv"><span class="card-cost">생산 코스트 <b>' + u.cost + '원</b></span> 레벨 <span class="lvnum"><b>' + u.level + '</b><i>' + (u.plusLevel ? '+' + u.plusLevel : '') + '</i></span></span>';
    }
    if (it.type === 'cat') {
      const n = UNITS.filter(u => u.rarity === it.cat.id && isOwned(u)).length;
      return '<span class="card-name" style="background:' + it.cat.color + '">' + it.cat.name + '</span>' +
        '<span class="card-art"><svg class="folder" viewBox="0 0 100 80" aria-hidden="true"><path d="M8 18 H38 L46 26 H92 V72 H8 Z" fill="' + it.cat.color + '" stroke="#2a1708" stroke-width="5" stroke-linejoin="round"/><path d="M8 34 H92" stroke="#2a1708" stroke-width="4"/></svg></span>' +
        '<span class="card-lv">캐릭터 <b>' + n + '</b></span>';
    }
    return '<span class="card-name back-name">돌아가기</span><span class="card-art"><svg class="folder" viewBox="0 0 40 40" aria-hidden="true"><path d="M12 14 H26 A9 9 0 0 1 26 32 H16" fill="none" stroke="#2a1708" stroke-width="5" stroke-linecap="round"/><path d="M17 8 L10 14 L17 20" fill="none" stroke="#2a1708" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  function build(){
    items = buildItems();
    track.innerHTML = '';
    cards = items.map((it, i) => {
      const b = document.createElement('button');
      b.className = 'card ' + it.type;
      b.setAttribute('aria-label', it.type === 'unit' ? it.unit.name : it.type === 'cat' ? it.cat.name : '돌아가기');
      b.innerHTML = cardHTML(it);
      b.addEventListener('click', () => { if (dragJustEnded) return; i === idx ? press(it) : (idx = i, render()); });
      if (it.type === 'unit') b.addEventListener('pointerdown', e => startPress(e, it.unit, 'card'));
      track.appendChild(b);
      return b;
    });
    render();
  }

  // 가운데 카드를 한 번 더 누르면: 캐릭터는 편성/해제, 등급 칸은 들어가기, 돌아가기는 나오기
  function press(it){
    if (it.type === 'cat') { basicIdx = idx; mode = it.cat.id; idx = 0; build(); return; }
    if (it.type === 'back') { mode = 'basic'; idx = basicIdx; build(); return; }
    const ids = deckIds();
    if (ids.includes(it.unit.id)) setDeck(ids.filter(x => x !== it.unit.id));
    else if (ids.length < 10) setDeck(ids.concat(it.unit.id));
    else { hint.textContent = '출진 슬롯이 가득 찼어요. 위 칸을 눌러 빼고 넣어 주세요.'; return; }
    renderSlots(); render();
  }

  function render(){
    const ids = deckIds();
    cards.forEach((c, i) => {
      const off = i - idx;
      c.style.setProperty('--off', off);
      c.classList.toggle('center', off === 0);
      c.classList.toggle('in-deck', items[i].type === 'unit' && ids.includes(items[i].unit.id));
      c.hidden = Math.abs(off) > 3;
    });
    const it = items[idx];
    hint.textContent = it.type === 'unit'
      ? (ids.includes(it.unit.id) ? '한 번 더 누르면 출진 슬롯에서 빠져요.' : '한 번 더 누르면 출진 슬롯에 들어가요.')
      : it.type === 'cat' ? '한 번 더 누르면 ' + it.cat.name + ' 칸으로 들어가요.' : '한 번 더 누르면 돌아가요.';
    if (it.type === 'unit') hint.textContent += ' 위 칸으로 끌어다 놓아도 돼요. (칸 위에서 잠깐 기다리면 밀어 넣기)';
    document.getElementById('t-info-btn').disabled = it.type !== 'unit';
    info.hidden = true;
    prev.disabled = idx === 0;
    next.disabled = idx === items.length - 1;
  }

  // ---------- 드래그로 편성 ----------
  // 캐릭터 카드 → 슬롯에 놓으면 그 칸에 들어감(그 칸에 있던 캐릭터는 빠짐)
  // 슬롯 → 다른 슬롯에 놓으면 자리 바꿈, 슬롯 밖에 놓으면 편성에서 빠짐
  const stageEl = scr.parentElement;
  let press0 = null, ghost = null, hoverEl = null, dragJustEnded = false;
  let hoverIdx = -1, holdTimer = 0, insertAt = -1;            // 한 칸 위에서 잠깐 기다리면 밀어내기 모드
  const HOLD_MS = 550;
  function insertPreview(k){
    const cur = deckIds(), d = press0.u.id;
    const base = cur.filter(x => x !== d);
    const at = Math.min(k, base.length);
    const ids = base.slice(); ids.splice(at, 0, null);
    const moved = ids.filter((x, i) => x && cur.indexOf(x) !== -1 && i > cur.indexOf(x));
    return { ids: ids.slice(0, 10), hole: at, moved };
  }
  function setHover(idx){
    if (idx === hoverIdx) return;
    hoverIdx = idx;
    clearTimeout(holdTimer);
    if (insertAt !== -1) { insertAt = -1; renderSlots(); }      // 다른 칸으로 옮기면 미리보기 취소
    if (idx === -1) return;
    holdTimer = setTimeout(() => {
      if (!press0 || !press0.dragging) return;
      insertAt = idx;
      renderSlots(insertPreview(idx));
    }, HOLD_MS);
  }

  function startPress(e, u, from){
    if (e.button !== undefined && e.button !== 0) return;
    press0 = { x: e.clientX, y: e.clientY, u, from, dragging: false };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, { once: true });
    window.addEventListener('pointercancel', onCancel, { once: true });
  }
  function slotAt(x, y){
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.t-slot') : null;
  }
  function onMove(e){
    if (!press0) return;
    if (!press0.dragging) {
      if (Math.hypot(e.clientX - press0.x, e.clientY - press0.y) < 8) return;
      press0.dragging = true;
      ghost = document.createElement('div');
      ghost.className = 't-ghost';
      ghost.innerHTML = art(press0.u, true);
      stageEl.appendChild(ghost);
    }
    e.preventDefault();
    const r = stageEl.getBoundingClientRect();
    ghost.style.left = (e.clientX - r.left) + 'px';
    ghost.style.top = (e.clientY - r.top) + 'px';
    const sl = slotAt(e.clientX, e.clientY);
    const idx = sl ? +sl.dataset.i : -1;
    // 밀어내기 미리보기 중에는 비워 둔 칸(hole) 근처에 있으면 그대로 유지
    if (insertAt !== -1 && sl && sl.classList.contains('hole')) return;
    setHover(idx);
    const cur = slotAt(e.clientX, e.clientY);
    if (hoverEl !== cur) { if (hoverEl) hoverEl.classList.remove('drop-hover'); hoverEl = cur; if (cur && insertAt === -1) cur.classList.add('drop-hover'); }
  }
  function endDrag(){
    window.removeEventListener('pointermove', onMove);
    if (ghost) ghost.remove();
    if (hoverEl) hoverEl.classList.remove('drop-hover');
    ghost = null; hoverEl = null;
    clearTimeout(holdTimer); hoverIdx = -1;
  }
  function onCancel(){ endDrag(); press0 = null; }
  function onUp(e){
    const p = press0; press0 = null;
    if (!p || !p.dragging) { endDrag(); return; }
    const sl = slotAt(e.clientX, e.clientY);
    const ins = insertAt; insertAt = -1;
    endDrag();
    dragJustEnded = true; setTimeout(() => dragJustEnded = false, 0);
    const ids = deckIds();
    const from = ids.indexOf(p.u.id);
    if (ins !== -1 && sl) {                                                          // 밀어내기: 그 자리에 끼워 넣고 뒤는 한 칸씩 밀림
      const base = ids.filter(x => x !== p.u.id);
      base.splice(Math.min(ins, base.length), 0, p.u.id);
      setDeck(base.slice(0, 10));                                                    // 10칸 넘치면 맨 끝 캐릭터는 빠짐
    } else if (sl) {
      let to = Math.min(+sl.dataset.i, from >= 0 ? ids.length - 1 : ids.length);
      if (from >= 0) { const t = ids[to]; ids[to] = p.u.id; ids[from] = t; }          // 자리 바꾸기
      else if (to < ids.length) ids[to] = p.u.id;                                     // 그 칸의 캐릭터와 교체
      else if (ids.length < 10) ids.push(p.u.id);                                     // 빈 칸에 넣기
      setDeck(ids.filter(Boolean));
    } else if (p.from === 'slot' && from >= 0) {
      ids.splice(from, 1); setDeck(ids);                                              // 슬롯 밖으로 빼기
    }
    renderSlots(); render();
  }

  document.getElementById('t-info-btn').addEventListener('click', () => {
    const it = items[idx];
    if (it.type !== 'unit') return;
    if (!info.hidden) { info.hidden = true; return; }
    info.innerHTML = '<b>' + it.unit.name + '</b><br>' + it.unit.desc;
    info.hidden = false;
  });
  info.addEventListener('click', () => info.hidden = true);
  prev.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
  next.addEventListener('click', () => { if (idx < items.length - 1) { idx++; render(); } });
  document.getElementById('btn-team').addEventListener('click', () => {
    mode = 'basic'; idx = CATEGORIES.length; build(); renderSlots(); scr.hidden = false;
  });
  document.getElementById('t-back').addEventListener('click', () => { scr.hidden = true; });
})();

// ---------- 개발자 코드: 홈 화면 '고양이 기지' 글자를 빠르게 5번 누르면 입력창이 열림 ----------
// 코드는 그대로 적지 않고 암호화한 값(SHA-256)만 넣어 둠
const DEV_CODE_HASH = '3950b7021b214e9f66bc5187d50dc1bf33d539995d3a5c5a5f951dd8693bb583';
(function(){
  const title = document.getElementById('home-title'), form = document.getElementById('dev-code');
  const input = document.getElementById('dev-code-input'), msg = document.getElementById('dev-code-msg');
  let taps = 0, timer = 0;
  title.addEventListener('click', () => {
    taps++; clearTimeout(timer); timer = setTimeout(() => taps = 0, 1500);
    if (taps >= 5) {
      taps = 0;
      if (DEV) {                                       // 이미 켜져 있으면 끄기
        try { localStorage.removeItem('catwar-dev-on'); localStorage.removeItem('catwar-dev-code'); } catch (e) {}
        location.reload(); return;
      }
      input.value = ''; msg.textContent = ''; form.hidden = false; input.focus();
    }
  });
  document.getElementById('dev-code-cancel').addEventListener('click', () => form.hidden = true);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    let hex = '';
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value.trim()));
      hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (err) {}
    if (hex === DEV_CODE_HASH) {
      try { localStorage.setItem('catwar-dev-on', '1'); localStorage.setItem('catwar-dev-code', '1'); } catch (err) {}
      location.reload();
    } else msg.textContent = '코드가 맞지 않아요.';
  });
})();

// ---------- 개발자 모드: 주인 계정 확인 ----------
(async function(){
  const btn = document.getElementById('dev-toggle');
  btn.textContent = DEV ? '개발자 모드 끄기' : '개발자 모드 켜기';
  btn.addEventListener('click', () => {
    try { if (DEV) { localStorage.removeItem('catwar-dev-on'); localStorage.removeItem('catwar-dev-code'); } else localStorage.setItem('catwar-dev-on', '1'); } catch (e) {}
    location.reload();
  });
  let owner = false, known = false;
  // window.claude 는 페이지가 열린 뒤 조금 늦게 준비될 수 있어서 최대 10초 기다림
  for (let i = 0; i < 50 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 200));
  try {
    const user = window.claude && window.claude.use ? await window.claude.use('user') : null;
    if (user) { owner = !!(await user.isOwner()); known = true; }
  } catch (e) {}
  if (owner) btn.hidden = false;                      // 주인에게만 버튼이 보임
  else if (known && DEV && localStorage.getItem('catwar-dev-code') !== '1') {   // 주인이 아니고 코드로 켠 것도 아니면 끄기
    try { localStorage.removeItem('catwar-dev-on'); } catch (e) {}
    location.reload();
  }
})();

// pool 에 레어 캐릭터 id 를 넣으면 그 시리즈에서 나옴 (지금은 비어 있음)
// 레어 뽑기는 시리즈 하나로 통합. 레어 뽑기 캐릭터(gacha: 'rare')가 전부 여기서 나옴
const RARE_SERIES = [
  { id:'ultra', name:'울트라 한일고양이 축제', c1:'#5a1f8a', c2:'#e8468a', sub:'모든 레어 냥코가 한 곳에!', pool:[] },
];

// 등급별 확률 (%)
const RARE_RATES = [
  { rarity:'rare',   name:'레어',           rate:65 },
  { rarity:'super',  name:'슈퍼레어',       rate:25 },
  { rarity:'uber',   name:'울트라슈퍼레어', rate:9  },
  { rarity:'legend', name:'레전드레어',     rate:1  },
];
// 먼저 등급을 확률대로 고르고, 그 등급 캐릭터 중 하나를 같은 확률로 고름.
// 시리즈에 아직 없는 등급은 빼고 남은 등급끼리 비율대로 다시 계산함.
function rareDraw(pool){
  const tiers = RARE_RATES.map(t => ({ t, units: pool.filter(u => u.rarity === t.rarity) })).filter(x => x.units.length);
  const total = tiers.reduce((a, x) => a + x.t.rate, 0);
  let r = Math.random() * total;
  for (const x of tiers) { if ((r -= x.t.rate) < 0) return x.units[Math.floor(Math.random() * x.units.length)]; }
  const last = tiers[tiers.length - 1].units; return last[last.length - 1];
}

// ---------- 뽑기 공용 (연출 + 결과) ----------
const MAXED_REWARD = 1000;   // 플러스 레벨이 다 찬 패시브가 또 나오면 주는 돈
const GACHA = (function(){
  const show = document.getElementById('g-show'), res = document.getElementById('g-res');
  const toast = document.getElementById('toast');
  let toastTimer = 0, onClose = null;
  function showToast(msg){
    toast.textContent = msg; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, 1800);
  }
  // 뽑은 캐릭터 지급: 처음이면 NEW, 중복이면 +1 레벨
  function grant(u){
    PLAYER.owned = PLAYER.owned || ['cat'];
    const isNew = !isOwned(u);
    if (isNew) PLAYER.owned.push(u.id);
    else {
      if (u.maxPlus === undefined || (u.plusLevel || 0) < u.maxPlus) u.plusLevel = (u.plusLevel || 0) + 1;
      else { PLAYER.money += MAXED_REWARD; return { u, isNew: false, plus: u.plusLevel, maxed: true, money: MAXED_REWARD }; }   // +10 다 찼으면 돈으로
      PLAYER.plusLevels = PLAYER.plusLevels || {};
      PLAYER.plusLevels[u.id] = u.plusLevel;
    }
    return { u, isNew, plus: u.plusLevel || 0, maxed: u.maxPlus !== undefined && (u.plusLevel || 0) >= u.maxPlus };
  }
  // 연출: 집게 팔이 캡슐을 내림 → 빛이 회전하며 캡슐이 빙글빙글 → 번쩍 → 결과
  function play(results, opt){
    const n = results.length;
    const xs = n === 1 ? [50] : Array.from({length:n}, (_, i) => 5 + i * (90 / (n - 1)));
    const sc = xs.map((x, i) => n === 1 ? 1.6 : 1.1 - Math.abs(x - 50) / 110);
    const mid = (n - 1) / 2;
    document.getElementById('g-show-title').textContent = opt.title;
    show.classList.toggle('rare', !!opt.rare);
    document.getElementById('claws').innerHTML = xs.map((x, i) =>
      '<div class="claw" style="left:' + x + '%;--s:' + sc[i] + ';--d:' + ((mid - Math.abs(i - mid)) * .07) + 's;z-index:' + Math.round(sc[i] * 10) + '">' +
      '<svg viewBox="0 0 100 230" aria-hidden="true"><use href="#claw-arm"/><g class="ball"><use href="#' + opt.capsule + '" transform="translate(0 130)"/></g></svg></div>'
    ).join('');
    const flash = document.getElementById('g-flash');
    flash.classList.remove('on');
    show.hidden = false; res.hidden = true; onClose = opt.onClose;
    setTimeout(() => { flash.classList.add('on'); }, 2300);
    setTimeout(() => { show.hidden = true; showResult(results); }, 2550);
  }
  // 레어 뽑기 결과에 붙는 등급 표시
  const RARITY_LABEL = { rare:['레어','#ffd23f'], super:['슈퍼레어','#ff9a3d'], uber:['울트라슈퍼레어','#ff5f7e'], legend:['레전드레어','#c58bff'] };
  function cardHTML(r, delay){
    const rl = RARITY_LABEL[r.u.rarity];
    return '<div class="g-item" style="animation-delay:' + delay + 's">' +
      (rl ? '<span class="rar-big" style="color:' + rl[1] + '">' + rl[0] + '</span>' : '') +
      '<div class="g-card' + (rl ? ' r-' + r.u.rarity : '') + '">' +
      '<span class="tag' + (r.isNew ? '' : ' plus') + '">' + (r.isNew ? 'NEW!' : '+' + r.plus + (r.maxed ? ' MAX' : '')) + '</span>' +
      (r.u.passive ? '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#icon-' + r.u.art + '"/></svg>'
                   : '<svg viewBox="0 0 240 260" aria-hidden="true"><use href="#' + (r.u.art || 'soldier') + '"/></svg>') +
      '<span class="nm">' + r.u.name + '</span>' + (r.money ? '<span class="money-got">돈 +' + r.money.toLocaleString() + '</span>' : '') + '</div></div>';
  }
  // 결과 배경: 보이는 카드 중 가장 높은 등급에 맞춤 (레어 무난 / 슈퍼레어 / 울트라 빛남 / 레전드 화려)
  const RANK = ['rare', 'super', 'uber', 'legend'];
  function setBg(list){
    let best = -1;
    list.forEach(r => best = Math.max(best, RANK.indexOf(r.u.rarity)));
    res.classList.remove('bg-rare', 'bg-super', 'bg-uber', 'bg-legend');
    if (best >= 0) res.classList.add('bg-' + RANK[best]);
  }
  // 여러 번 뽑기: 한 장씩 넘겨 보고, 마지막에 전부 한 번에 보여줌
  let queue = [], step = 0;
  function showOne(){
    const box = document.getElementById('g-cards'), ok = document.getElementById('g-ok');
    box.style.setProperty('--cols', 1); box.style.setProperty('--w', '30cqw'); box.style.setProperty('--fs', '3.6cqw');
    box.innerHTML = cardHTML(queue[step], 0);
    setBg([queue[step]]);
    ok.textContent = '다음 (' + (step + 1) + '/' + queue.length + ')';
  }
  function showAll(results){
    const n = results.length, many = n > 1;
    const box = document.getElementById('g-cards');
    box.style.setProperty('--cols', many ? Math.min(6, Math.ceil(n / 2)) : 1);
    box.style.setProperty('--w', many ? '13cqw' : '30cqw');
    box.style.setProperty('--fs', many ? '1.8cqw' : '3.6cqw');
    box.innerHTML = results.map((r, i) => cardHTML(r, i * .05)).join('');
    setBg(results);
    document.getElementById('g-ok').textContent = '확인';
    queue = [];
  }
  function showResult(results){
    if (results.length > 1) { queue = results; step = 0; showOne(); }
    else showAll(results);
    res.hidden = false;
  }
  document.getElementById('g-ok').addEventListener('click', () => {
    if (queue.length) {                              // 다음 카드 → 마지막이면 전체 보기
      step++;
      if (step < queue.length) showOne(); else showAll(queue);
      return;
    }
    res.hidden = true; if (onClose) onClose();
  });
  return { grant, play, showToast };
})();

// ---------- 레어 뽑기 (시리즈별: 레어 티켓 1장 → 1회, 통조림 1500 → 10+1회) ----------
(function(){
  const scr = document.getElementById('rare-screen'), tabs = document.getElementById('r-tabs');
  let cur = 0;
  function render(){
    const sr = RARE_SERIES[cur];
    tabs.innerHTML = '';
    RARE_SERIES.forEach((x, i) => {
      const b = document.createElement('button');
      b.className = 'r-tab' + (i === cur ? ' on' : '');
      b.textContent = x.name;
      b.addEventListener('click', () => { cur = i; render(); });
      tabs.appendChild(b);
    });
    const bn = document.getElementById('r-banner');
    bn.style.setProperty('--c1', sr.c1); bn.style.setProperty('--c2', sr.c2);
    document.getElementById('r-title').textContent = sr.name;
    document.getElementById('r-sub').textContent = sr.sub;
    document.getElementById('r-caption').textContent = sr.pool.length
      ? '이 시리즈에서 ' + sr.pool.length + '종의 레어 캐릭터가 나와요!'
      : '이 시리즈의 레어 캐릭터는 곧 추가돼요.';
    document.getElementById('r-prev').disabled = cur === 0;
    document.getElementById('r-next').disabled = cur === RARE_SERIES.length - 1;
    document.getElementById('r-tickets').textContent = ticketText('rareTicket');
    document.getElementById('r-cans').textContent = ticketText('cans');
    document.getElementById('r-roll1').disabled = !hasTickets('rareTicket', 1);
    document.getElementById('r-roll11').disabled = !hasTickets('cans', 1500);
  }
  function roll(n, kind, cost){
    const sr = RARE_SERIES[cur];
    const pool = sr.pool.map(id => UNITS.find(u => u.id === id)).filter(Boolean);
    if (!pool.length) { GACHA.showToast(sr.name + '에는 아직 캐릭터가 없어요.'); return; }
    if (!hasTickets(kind, cost)) return;
    useTickets(kind, cost);
    const results = [];
    for (let i = 0; i < n; i++) results.push(GACHA.grant(rareDraw(pool)));
    savePlayer(); renderPlayer(); render();
    GACHA.play(results, { title: '레어 뽑기', capsule: 'gold-capsule', rare: true, onClose: render });
  }
  document.getElementById('btn-rare').addEventListener('click', () => { render(); scr.hidden = false; });
  document.getElementById('r-back').addEventListener('click', () => { scr.hidden = true; });
  document.getElementById('r-prev').addEventListener('click', () => { if (cur > 0) { cur--; render(); } });
  document.getElementById('r-next').addEventListener('click', () => { if (cur < RARE_SERIES.length - 1) { cur++; render(); } });
  document.getElementById('r-roll1').addEventListener('click', () => roll(1, 'rareTicket', 1));
  document.getElementById('r-roll11').addEventListener('click', () => roll(11, 'cans', 1500));
})();

// 클리어 기록 키: 1장은 '1-1', 2장은 'c2:1-1', 3장은 'c3:1-1'
function stageKey(ch, id){ return ch === 1 ? id : 'c' + ch + ':' + id; }
const _stageCache = {};
function chapterStageList(ch){
  if (_stageCache[ch]) return _stageCache[ch];
  const c = CHAPTERS.find(x => x.no === ch);
  return _stageCache[ch] = STAGES.map(st => Object.assign({}, st, {
    ch, key: stageKey(ch, st.id), chName: c.name,
    mult: (st.mult || 1) * c.enemyMult,
    enemyBaseHp: Math.round(st.enemyBaseHp * c.baseMult),
    reward: Object.assign({}, st.reward, { money: Math.round(st.reward.money * c.rewardMult) }),
  }));
}
let SELECTED_CH = 1;   // 시작할 때 고른 장
function chapterCleared(ch){ return chapterStageList(ch).every(st => PLAYER.cleared.includes(st.key)); }
function chapterUnlocked(ch){ return ch === 1 || chapterCleared(ch - 1); }

// 개발자 모드도 스테이지는 하나씩 직접 깨야 함.

  chapterStageList(1).forEach(st => {

  });

  savePlayer();
}
// 개발자 모드: 1장 마지막 스테이지(기숙사로 향하는 문) 클리어 기록만 한 번 초기화
if (IS_DEV_LINK && !PLAYER.devResetCh1LastV2) {

}

// 그룹 % = (그 장에서 모은 보물 수 / 그룹 보물 수) × 100. 장마다 따로 100%까지, 3장 합치면 최대 300%.
// stages 는 아래에서 48개 스테이지에 자동으로 나눠 넣음 (장마다 같은 스테이지에서 그 장의 보물을 줌)
